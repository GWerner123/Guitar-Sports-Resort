<style>
  :root {
    --ink: #1d1a17; --paper: #FFFDF7; --cream: #F6EEDC; --line: #E4D9C3; --muted: #6E6255;
    --red: #E5483F; --red2: #C93A32; --ball: #E3E85A; --green: #06A66B; --amber: #E0A11B;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; overflow: hidden; position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font: 15px/1.4 var(--ui); color: var(--ink); }
  main { position: fixed; inset: 0; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  svg { display: block; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); letter-spacing: .02em; }

  /* ---------- shared pieces ---------- */
  .round { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; box-shadow: 0 3px 0 var(--ink); }
  .round svg { width: 24px; height: 24px; }
  .round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .round.small { width: 38px; height: 38px; box-shadow: 0 2px 0 var(--ink); } .round.small svg { width: 18px; height: 18px; }
  .btn { min-height: 46px; padding: 8px 18px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
  .btn.primary { background: var(--red); color: #fff; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.danger-btn { background: var(--ink); color: #fff; }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink), 0 20px 50px rgba(0,0,0,.35); padding: 18px 22px; }
  .card h2 { margin: 0; font-size: 28px; line-height: 1.05; font-weight: 900; letter-spacing: -.02em; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .actions.col { flex-direction: column; } .actions.col .btn { width: 100%; }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .meta { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .kicker { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font-size: 13px; }
  .chip.good { background: #D6F3E6; } .chip.warn { background: #FCEBC6; } .chip small { color: var(--muted); }
  .learn { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }
  .learn li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; line-height: 1.35; }
  .learn .ic { flex: 0 0 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--ball); border: 2px solid var(--ink); font-weight: 900; font-size: 14px; vertical-align: 0; }
  .learn.opened .ic { background: #D6F3E6; }
  .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 10px calc(16px + env(safe-area-inset-left, 0px)); z-index: 2; }
  .tour .bar, .screen .bar { background: var(--cream); border-bottom: 3px solid var(--ink); }
  .bar h2 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
  .bar .count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; }

  /* ---------- the menus (over the court) ---------- */
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #ui.v-home { background: radial-gradient(ellipse at 50% 46%, rgba(10,14,20,.05) 0, rgba(10,14,20,.42) 75%); }
  .home { position: absolute; inset: 0; pointer-events: none; }
  .home > * { pointer-events: auto; }
  .streak { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
  .streak::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--ball); border: 2px solid var(--ink); box-shadow: inset -3px -3px 0 #BFC43A; }
  .streak b { font-size: 18px; } .streak.cold { font-weight: 600; color: var(--muted); }
  .corner { position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }
  .dropdown { position: absolute; right: 0; top: 56px; min-width: 190px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink), 0 14px 30px rgba(0,0,0,.3); overflow: hidden; }
  .dropdown button { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 2px solid var(--line); background: none; font-weight: 700; font-size: 15px; }
  .dropdown button:last-child { border-bottom: 0; } .dropdown button:hover, .dropdown button:focus-visible { background: var(--cream); }
  .center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; width: min(640px, 86vw); pointer-events: none; }
  .center > * { pointer-events: auto; }
  .logo { margin: 0; font: italic 900 clamp(54px, 13vh, 104px)/.9 var(--ui); letter-spacing: -.045em; color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); transform: rotate(-3deg); }
  .logo span { color: var(--ball); }
  .tag { margin: 10px 0 18px; display: inline-block; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--paper); padding: 4px 12px; border-radius: 8px; }
  .bigs { display: flex; gap: 14px; justify-content: center; }
  .big { flex: 1; max-width: 270px; min-height: 84px; padding: 10px 16px; border: 3px solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 0 5px 0 var(--ink); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .big span { font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .big small { font-size: 12.5px; font-weight: 600; color: var(--muted); line-height: 1.25; }
  .big.primary { background: var(--red); color: #fff; } .big.primary small { color: #FFE3DF; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .clip { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 92px; padding: 0; border: 0; background: none; transform: rotate(6deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); transition: transform .15s; }
  .clip:hover { transform: rotate(2deg) translateY(-3px); }
  .clip svg { width: 100%; height: auto; }
  .clip span { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%) rotate(-6deg); background: var(--ink); color: var(--paper); font-weight: 800; font-size: 12px; padding: 2px 9px; border-radius: 6px; }

  /* ---------- full screens: the Tour, Free Play, settings, the clipboard ---------- */
  .tour, .screen { position: absolute; inset: 0; background: var(--cream); }
  .scroll { overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
  .map { position: absolute; inset: 0; padding-top: 64px; display: flex; align-items: center; }
  .mapsvg { height: min(400px, calc(100dvh - 76px)); width: auto; flex: 0 0 auto; }
  .node { cursor: pointer; } .node.locked { cursor: default; }
  .node .nm { font: 800 17px var(--ui); fill: var(--ink); } .node .sb { font: 600 12px var(--ui); fill: var(--muted); }
  .node:focus-visible .surround { stroke: var(--red); }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.28); opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
  .node:hover:not(.locked) .surround { stroke-width: 6; }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .pin { animation: bob 1.2s ease-in-out infinite; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(20,16,12,.45); z-index: 3; }
  .sheet { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 24px); overflow: auto; }
  .sheet .sub { margin: 6px 40px 0 0; color: var(--muted); font-size: 14px; }
  .sheet .note { margin: 10px 0 0; font-size: 14px; font-weight: 700; }
  .xbtn { position: absolute; right: 14px; top: 14px; }
  .mlist { display: grid; gap: 8px; margin-top: 14px; }
  .mrow { display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink); }
  .mrow:disabled { opacity: .5; box-shadow: none; }
  .mrow .num { flex: 0 0 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: var(--ball); border: 2px solid var(--ink); }
  .mrow.notes .num { background: var(--ink); color: var(--paper); }
  .mrow .mt { flex: 1; font-weight: 800; font-size: 16px; } .mrow .mt small { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); }
  .mrow .st { font-weight: 800; font-size: 14px; } .mrow .st.go { color: #fff; background: var(--red); border-radius: 999px; padding: 4px 12px; border: 2px solid var(--ink); } .mrow .st.won { color: var(--green); }
  .body { position: absolute; inset: 0; padding: calc(70px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 20px calc(16px + env(safe-area-inset-left, 0px)); }
  .card.wide { width: min(720px, 100%); margin: 0 auto; }
  .field { margin-bottom: 14px; } .field > label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 6px; } .field > label b { float: right; font-family: var(--mono); }
  .field small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
  select, input[type=text] { width: 100%; min-height: 44px; font: 600 15px var(--ui); padding: 6px 10px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--red); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .courts { display: flex; gap: 8px; flex-wrap: wrap; }
  .court-pick { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; font-weight: 700; font-size: 14px; }
  .court-pick i { width: 34px; height: 26px; border-radius: 6px; border: 2px solid var(--ink); }
  .boxes .court-pick { flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 12px; } .boxes .court-pick small { font-weight: 600; font-size: 11.5px; color: var(--muted); }
  .court-pick.on { background: var(--ball); box-shadow: 0 3px 0 var(--ink); } .court-pick:disabled { opacity: .5; }
  .seg { display: flex; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; border: 0; border-right: 3px solid var(--ink); background: #fff; font-weight: 700; font-size: 14px; padding: 4px 8px; }
  .seg button:last-child { border-right: 0; } .seg button.on { background: var(--ink); color: var(--paper); } .seg button:disabled { color: #A89E90; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 2px solid var(--line); }
  .setrow small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; } .setrow input[type=range] { width: 160px; }
  .switch { position: relative; flex: 0 0 54px; height: 30px; } .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 15px; background: #D6CCBB; border: 3px solid var(--ink); }
  .switch span::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: transform .15s; }
  .switch input:checked + span { background: var(--green); } .switch input:checked + span::after { transform: translateX(24px); }
  .switch input:focus-visible + span { outline: 3px solid var(--red); outline-offset: 2px; }
  .mictest { border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; background: #fff; margin-bottom: 8px; }

  roof: '#D98A3D', roof2: '#B8692A', wood: '#8A5A35', ink: '#2E3A46', grass: '#5FAE48', grass2: '#4F9A3C', red: '#E5483F', white: '#FFFFFF' };
// The sky in a few bands (pixel-style, no smooth gradient), with a sun and drifting clouds.

// The sea from the horizon down to y1, with a volcano island offshore and glints on the water.

// A palm: a curving trunk and drooping fronds.
function rsPalm(x, g, h, lean = 1, t = 0) {
  const sway = Math.sin(t * 1.3 + x) * 3;
  for (let k = 0; k < h; k += PX) mRect(x + lean * (k * k) / (h * 5) + sway * k / h, g - k, 8, PX + 1, k % 12 < 6 ? RS.palm : '#94683F');
  const tx = x + lean * h / 5 + sway + 4, ty = g - h;
  for (const [dx, dy] of [[-34, 14], [-24, 22], [34, 14], [24, 22], [-6, 26], [10, 26]]) mLine(tx, ty, tx + dx, ty + dy, dy > 20 ? RS.leaf2 : RS.leaf, 6);
  for (const [dx, dy] of [[-30, -6], [30, -6], [0, -12]]) mLine(tx, ty, tx + dx, ty + dy + 10, RS.leaf, 6);
  mDisc(tx, ty + 4, 6, RS.wood);
}
// A thatched tiki stage (the band plays under it).
function rsTiki(x, g, w = 260) {
  mRect(x - w / 2, g - 10, w, 10, RS.wood); mRect(x - w / 2, g - 12, w, 4, '#A06A40');
  for (const px of [-w / 2 + 10, w / 2 - 18]) mRect(x + px, g - 104, 8, 94, RS.wood);
  for (let k = 0; k < 7; k++) { const ww = 70 + k * (w - 30) / 6, y = g - 150 + k * 7; mRect(x - ww / 2, y, ww, 8, k % 2 ? RS.roof : RS.roof2); }   // narrow at the peak, wide at the eaves
  for (let i = 0; i < 12; i++) mRect(x - w / 2 - 14 + i * ((w + 28) / 12), g - 104, 6, 10 + (i % 3) * 4, RS.roof2);   // fringe
  for (let i = 0; i < 8; i++) mDisc(x - w / 2 + 20 + i * (w - 40) / 7, g - 96, 5, ['#FF6B6B', '#FFD166', '#06D6A0', '#4CC9F0'][i % 4]);   // lanterns
}

const CLUBS = FB_DATA.clubs.map(c => {

const SAVE = { prog: 'fretball-progress', stats: 'fretball-stats', streak: 'fretball-streak', profile: 'fretball-profile', sel: 'fretball-freeplay' };

// ---------- the World Tour ----------
const PROG = load(SAVE.prog, { won: {}, notesBest: {} });
PROG.boxes = PROG.boxes || {}; PROG.huntBest = PROG.huntBest || 0; PROG.stars = PROG.stars || {};
// (stars came later: a match already won has its first star)
Object.keys(PROG.won).forEach(id => { if (!/-0$/.test(id) && !PROG.stars[id]) PROG.stars[id] = 1; });
const starsOf = id => PROG.stars[id] || 0;
const STAR_RULES = ['Win the match', 'Win, landing 80% of your balls', 'Win without dropping a point'];
// (Fret Hunts came later: anyone already past a club's first match counts its hunt as done)
CLUBS.forEach(c => { if (c.matches.slice(1).some(m => PROG.won[m.id])) PROG.won[c.matches[0].id] = true; });
const matchWon = id => !!PROG.won[id];
const clubDone = c => CLUB[c].matches.every(m => matchWon(m.id));
const PLAYTEST = /playtest/.test(location.hash);   // (play-testing from the editor: everything's open)
const clubOpen = c => { if (PLAYTEST) return true; const i = CLUBS.findIndex(x => x.id === c); return i === 0 || clubDone(CLUBS[i - 1].id); };
const matchOpen = m => { if (PLAYTEST) return true; const c = CLUB[m.club], i = c.matches.indexOf(m); return clubOpen(c.id) && (i === 0 || matchWon(c.matches[i - 1].id)); };
function nextMatch() { for (const c of CLUBS) for (const m of c.matches) if (!matchWon(m.id) && matchOpen(m)) return m; return null; }
const currentClub = () => { const n = nextMatch(); return n ? CLUB[n.club] : CLUBS[CLUBS.length - 1]; };
function winMatch(id) { const first = !PROG.won[id]; PROG.won[id] = true; store(SAVE.prog, PROG); return first; }

// ---------- what Free Play has opened ----------
function freeOpen() {
  const clubs = CLUBS.filter(c => clubOpen(c.id));
  const tracks = [...new Set(clubs.flatMap(c => c.matches.flatMap(m => m.tracks)))];
  const won = CLUBS.flatMap(c => c.matches).filter(m => matchWon(m.id));
  const keys = new Set([0]); won.forEach(m => m.keys.forEach(k => keys.add(k)));
  const hi = Math.max(90, ...won.map(m => m.tempo[1])), lo = 60;
  const opps = OPPONENTS.map((o, i) => !o.after || clubDone(o.after) ? i : -1).filter(i => i >= 0);
  return { clubs, tracks, keys: ALL_KEYS.filter(k => keys.has(k)), tempo: [lo, hi], opps };
}

// Settings' mic check: the note it hears, how loud you are, and where the listening line sits.
function micTestLoop() {
  if (micTestLoop.on) return; micTestLoop.on = true;
  let lastName = '', lastAt = 0;
  const step = () => {
    const bar = document.getElementById('mtBar'); if (!bar || !mic) { micTestLoop.on = false; return; }
    const r = mic.lastR || 0, g = mic.floor ? Math.max(gate * .2, Math.min(gate, mic.floor * 2.2)) : gate;
    const pos = v => Math.max(0, Math.min(100, (20 * Math.log10(v + 1e-6) + 70) / 60 * 100));   // -70 dB to -10 dB across the bar
    bar.style.width = pos(r) + '%'; document.getElementById('mtGate').style.left = pos(g) + '%';
    const tc = document.getElementById('timingCheck'); if (tc && (TIMECHK.active || TIMECHK.msg)) tc.textContent = TIMECHK.active ? `Play one note on each click (${TIMECHK.offsets.length} of 8)` : TIMECHK.msg;
    const now = performance.now() / 1000; if (heard) { lastName = heard; lastAt = now; }
    const note = document.getElementById('mtNote'); if (note) { note.textContent = now - lastAt < 1.2 && lastName ? lastName : '…'; note.classList.toggle('hot', now - lastAt < .3); }
    requestAnimationFrame(step);

}

function edBuildTrack(t) { return trk(t.id, t.name, t.style, t.bpm, t.root, t.minor, t.chords); }
async function edPlay() {
  if (EDV.playing) { stopBacking(); EDV.playing = false; edRender(); return; }
  await audio(); const t = edTrack(); if (!t) return;
  const tr = edBuildTrack(t); GROUND = tr.ground; KEY = new Set(tr.key.pcs);
  Object.assign(LOC.backing, { ground: GROUND, style: t.style, bpm: t.bpm, start_bar: 0 }); BACKING_BPM = t.bpm;
  stopBacking(); startBacking(); EDV.playing = true; edRender();

    document.querySelectorAll('#ed-bars .cbar').forEach((b, i) => b.classList.toggle('now', i === bar)); requestAnimationFrame(tick); };

// ---------- saving the game file ----------
function edExport() {
  const problems = [];
  ED.clubs.forEach(c => { if (!c.matches.length) problems.push(`${c.name} has no matches`); c.matches.forEach(m => { if (!m.tracks.length) problems.push(`${c.name}: “${m.title}” has no tracks`); if (!m.keys.length) problems.push(`${c.name}: “${m.title}” has no keys`); }); });
  if (problems.length) { toast('Fix first: ' + problems[0]); return; }
  ED.clubs.forEach(c => c.matches.forEach(m => { if (m.tempo[0] > m.tempo[1]) m.tempo.reverse(); }));
  const json = JSON.stringify(ED).replace(/</g, '\\u003c');
  const html = PRISTINE.replace(/(<script type="application\/json" id="fb-data">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' })), a = document.createElement('a');
  a.href = url; a.download = 'fretball.html'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);

}

  else if (d.croot !== undefined || d.cq !== undefined) { const cur = t.chords[EDV.bar], q = d.cq !== undefined ? d.cq : (cur.match(/^[A-G][#b]?(.*)$/) || [])[1] || '', p = d.croot !== undefined ? +d.croot : edChordPc(cur), flats = (t.minor ? [2, 7, 0, 5, 10] : [5, 10, 3, 8, 1]).includes(t.root);
    t.chords[EDV.bar] = edChordName(p, q, flats); edSave(); edRestartIfPlaying(); }
  else if (id === 'ed-addbar') { t.chords.splice(EDV.bar + 1, 0, t.chords[EDV.bar]); EDV.bar++; edSave(); edRestartIfPlaying(); }
  else if (id === 'ed-dupbars') { if (t.chords.length <= 32) { t.chords = t.chords.concat(t.chords); edSave(); edRestartIfPlaying(); } }
  else if (id === 'ed-delbar') { t.chords.splice(EDV.bar, 1); EDV.bar = Math.min(EDV.bar, t.chords.length - 1); edSave(); edRestartIfPlaying(); }
  else if (id === 'ed-play') { edPlay(); return; }
  else if (id === 'ed-export') { edExport(); return; }
  else if (id === 'ed-test') { edSave(); stopBacking(); location.hash = '#playtest'; location.reload(); return; }
  else if (id === 'ed-close') { stopBacking(); location.hash = ''; location.reload(); return; }
  else if (id === 'ed-copy') { navigator.clipboard?.writeText(JSON.stringify(ED)).then(() => toast('Backup copied. Paste it into a note to keep it.'), () => toast('Couldn’t copy here.')); return; }
  else if (id === 'ed-paste') { const txt = prompt('Paste a Fretball backup:'); if (txt) { try { const d2 = JSON.parse(txt); if (!d2.clubs || !d2.tracks) throw 0; ED = d2; EDV.club = EDV.track = EDV.match = null; edSave(); toast('Backup loaded.'); } catch { toast('That isn’t a Fretball backup.'); } } }
  else if (id === 'ed-discard') { EDV.confirm = 'discard'; }
  else if (id === 'ed-discard2') { try { localStorage.removeItem(ED_KEY); } catch {} ED = edClone(FILE_DATA); EDV.confirm = null; EDV.saved = true; EDV.club = EDV.track = EDV.match = null; }
  else if (id === 'ed-cancel') { EDV.confirm = null; }
  else return;
  if (!/delclub|deltrack/.test(id)) EDV.confirm = EDV.confirm === 'discard' && id === 'ed-discard' ? 'discard' : EDV.confirm === 'discard' ? null : null;
  edRender();
}
function edChange(e) {
  const el = e.target, c = edClub();
  if (el.dataset.mtrack) { const m = c.matches[EDV.match]; m.tracks = el.checked ? [...m.tracks, el.dataset.mtrack] : m.tracks.filter(x => x !== el.dataset.mtrack); edSave(); return; }
  if (el.dataset.mwarm) { const m = c.matches[EDV.match]; m.warm = el.checked ? [...m.warm, el.dataset.mwarm] : m.warm.filter(x => x !== el.dataset.mwarm); if (!m.warm.length) m.warm = ['3rd']; edSave(); return; }
  edInput(e);
}
function openEditor() {
  ED = edClone(FB_DATA); EDV.saved = FB_DATA === FILE_DATA;
  const el = document.createElement('div'); el.id = 'editor'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Fretball Editor'); document.body.appendChild(el);

  const fit = () => { STAGE_INSET = Math.min(innerWidth * .9, el.offsetWidth) * VW / Math.max(1, innerWidth); };
  addEventListener('resize', fit); setTimeout(fit, 0);
  edRender(); fit();
}
// Play-testing: everything's unlocked, and a button goes back to the editor.
if (/playtest/.test(location.hash)) {
  const pill = document.createElement('button'); pill.id = 'edpill'; pill.textContent = '✎ Back to the editor'; pill.onclick = () => { stopBacking(); location.hash = '#admin'; location.reload(); };
  document.body.appendChild(pill);
}
