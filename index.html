<style>
  :root {
    --ink: #1d1a17; --paper: #FFFDF7; --cream: #F6EEDC; --line: #E4D9C3; --muted: #6E6255;
    --red: #E5483F; --red2: #C93A32; --ball: #E3E85A; --green: #06A66B; --amber: #E0A11B;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; overflow: hidden; position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font: 15px/1.4 var(--ui); color: var(--ink); }
  main { position: fixed; inset: 0; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  svg { display: block; }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); letter-spacing: .02em; }

  /* ---------- shared pieces ---------- */
  .round { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; box-shadow: 0 3px 0 var(--ink); }
  .round svg { width: 24px; height: 24px; }
  .round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .round.small { width: 38px; height: 38px; box-shadow: 0 2px 0 var(--ink); } .round.small svg { width: 18px; height: 18px; }
  .btn { min-height: 46px; padding: 8px 18px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
  .btn.primary { background: var(--red); color: #fff; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.danger-btn { background: var(--ink); color: #fff; }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink), 0 20px 50px rgba(0,0,0,.35); padding: 18px 22px; }
  .card h2 { margin: 0; font-size: 28px; line-height: 1.05; font-weight: 900; letter-spacing: -.02em; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .actions.col { flex-direction: column; } .actions.col .btn { width: 100%; }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .meta { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .kicker { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font-size: 13px; }
  .chip.good { background: #D6F3E6; } .chip.warn { background: #FCEBC6; } .chip small { color: var(--muted); }
  .learn { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }
  .learn li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; line-height: 1.35; }
  .learn .ic { flex: 0 0 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--ball); border: 2px solid var(--ink); font-weight: 900; font-size: 14px; vertical-align: 0; }
  .learn.opened .ic { background: #D6F3E6; }
  .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 10px calc(16px + env(safe-area-inset-left, 0px)); z-index: 2; }
  .tour .bar, .screen .bar { background: var(--cream); border-bottom: 3px solid var(--ink); }
  .bar h2 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
  .bar .count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; }

  /* ---------- the menus (over the court) ---------- */
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #ui.v-home { background: radial-gradient(ellipse at 50% 46%, rgba(10,14,20,.05) 0, rgba(10,14,20,.42) 75%); }
  .home { position: absolute; inset: 0; pointer-events: none; }
  .home > * { pointer-events: auto; }
  .streak { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
  .streak::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--ball); border: 2px solid var(--ink); box-shadow: inset -3px -3px 0 #BFC43A; }
  .streak b { font-size: 18px; } .streak.cold { font-weight: 600; color: var(--muted); }
  .corner { position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }
  .dropdown { position: absolute; right: 0; top: 56px; min-width: 190px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink), 0 14px 30px rgba(0,0,0,.3); overflow: hidden; }
  .dropdown button { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 2px solid var(--line); background: none; font-weight: 700; font-size: 15px; }
  .dropdown button:last-child { border-bottom: 0; } .dropdown button:hover, .dropdown button:focus-visible { background: var(--cream); }
  .center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; width: min(640px, 86vw); pointer-events: none; }
  .center > * { pointer-events: auto; }
  .logo { margin: 0; font: italic 900 clamp(54px, 13vh, 104px)/.9 var(--ui); letter-spacing: -.045em; color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); transform: rotate(-3deg); }
  .logo span { color: var(--ball); }
  .tag { margin: 10px 0 18px; display: inline-block; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--paper); padding: 4px 12px; border-radius: 8px; }
  .bigs { display: flex; gap: 14px; justify-content: center; }
  .big { flex: 1; max-width: 270px; min-height: 84px; padding: 10px 16px; border: 3px solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 0 5px 0 var(--ink); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .big span { font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  .big small { font-size: 12.5px; font-weight: 600; color: var(--muted); line-height: 1.25; }
  .big.primary { background: var(--red); color: #fff; } .big.primary small { color: #FFE3DF; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .clip { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 92px; padding: 0; border: 0; background: none; transform: rotate(6deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); transition: transform .15s; }
  .clip:hover { transform: rotate(2deg) translateY(-3px); }
  .clip svg { width: 100%; height: auto; }
  .clip span { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%) rotate(-6deg); background: var(--ink); color: var(--paper); font-weight: 800; font-size: 12px; padding: 2px 9px; border-radius: 6px; }

  .ls-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .ls-card { text-align: left; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 10px 12px; box-shadow: 0 3px 0 var(--ink); display: grid; gap: 2px; }
  .ls-card b { font: italic 800 18px Georgia, 'Times New Roman', serif; } .ls-card small { font-size: 12px; color: var(--muted); }
  .ls-peek { display: flex; margin-top: 6px; border-left: 2px solid var(--ink); } .ls-peek i { flex: 1; font-style: normal; border-right: 2px solid var(--ink); padding: 2px 6px; font-size: 11px; white-space: nowrap; overflow: hidden; } .ls-peek i.more { flex: 0 0 auto; border-right: 0; }
  .ls-peek .cr { font-size: 15px; } .ls-peek .cq { font-size: 10px; }
  .ls-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; } .ls-top .eback { padding: 0; }
  .ls-saved { font-size: 12px; font-weight: 700; color: var(--muted); flex: 1; } .ls-top .btn { min-height: 36px; padding: 2px 12px; }
  .lsheet { background: #FFFEF9; border: 2px solid #D9CFBC; border-radius: 6px; box-shadow: 0 2px 0 #D9CFBC, 0 12px 30px rgba(60,40,10,.08); padding: 18px clamp(12px, 3vw, 34px) 16px; }
  .ls-title { display: block; width: 100%; text-align: center; border: 0; border-bottom: 2px solid transparent; background: none; font: italic 800 clamp(24px, 4vw, 34px)/1.2 Georgia, 'Times New Roman', serif; color: var(--ink); padding: 2px 0; }
  .ls-title:hover, .ls-title:focus { border-bottom-color: #E4D9C3; outline: none; }
  .ls-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 10px 0 4px; font-size: 13px; font-weight: 800; }
  .ls-meta label { display: inline-flex; align-items: center; gap: 6px; }
  .ls-meta select { width: auto; min-height: 36px; font-size: 14px; border-width: 2px; padding: 2px 6px; max-width: 290px; }
  .ls-mm button { min-height: 34px; padding: 2px 10px; font-size: 13px; }
  .ls-tempo { display: inline-flex; align-items: center; gap: 4px; } .ls-tempo .kb { min-width: 34px; min-height: 34px; font-size: 18px; padding: 0; }
  .ls-tempo input { width: 64px; min-height: 36px; text-align: center; font: 800 16px var(--mono); border: 2px solid var(--ink); border-radius: 8px; }
  .ls-sub { text-align: center; margin: 2px 0 14px; font: italic 14px Georgia, serif; color: var(--muted); }
  .ls-chart { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 16px; margin: 8px 0 14px; }
  .ls-bar { position: relative; min-height: 78px; border: 0; border-left: 2px solid var(--ink); background: none; padding: 16px 8px 8px 12px; text-align: left; cursor: pointer; border-radius: 0; display: flex; align-items: center; color: var(--ink);
    background-image: linear-gradient(#E9E1D0, #E9E1D0); background-size: 100% 1px; background-position: 0 85%; background-repeat: no-repeat; }
  .ls-bar:nth-child(4n), .ls-bar.last { border-right: 2px solid var(--ink); }
  .ls-bar.last { border-right: 6px double var(--ink); } .ls-bar.last::after { content: ''; position: absolute; right: 7px; top: 38%; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); box-shadow: 0 12px 0 var(--ink); }
  .ls-bar:hover { background-color: #FFF9E4; } .ls-bar.sel { background-color: #FFF1B8; box-shadow: inset 0 -4px 0 var(--ball); }
  .ls-bar.now { background-color: #FDE3DF; } .ls-bar.now::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--red); }
  .ls-bar.now2::before { left: 50%; }
  .ls-n { position: absolute; left: 6px; top: 3px; font: 700 10px var(--ui); color: #A99B85; }
  .ls-two { display: flex; width: 100%; justify-content: space-between; gap: 4px; }
  .cs { white-space: nowrap; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: var(--ink); }
  .cr { font-size: 32px; line-height: 1; } .ca { font-size: .62em; vertical-align: .55em; margin-left: 1px; } .cq { font-size: 17px; vertical-align: 13px; margin-left: 1px; font-style: italic; }
  .ls-two .cr { font-size: 26px; } .ls-two .cq { font-size: 14px; vertical-align: 10px; }
  .ls-transport { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid #E9E1D0; padding-top: 12px; }
  .ls-play { min-width: 120px; font-size: 16px; } .ls-transport .ebtns .btn { min-height: 40px; padding: 4px 12px; font-size: 13.5px; }
  .ls-edit { margin: 14px 0; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 12px; display: grid; gap: 10px; }
  .ls-edhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .ls-edhead b { font: italic 800 18px Georgia, serif; }
  .ls-edhead .seg button, .ls-halves button { min-height: 36px; padding: 2px 12px; font-size: 13px; white-space: nowrap; }
  @media (min-height: 700px) and (min-width: 600px) { .ls-edit { position: sticky; bottom: 8px; z-index: 3; box-shadow: 0 -6px 24px rgba(40,30,10,.14), 0 4px 0 var(--ink); } }
  .ls-halves .cr { font-size: 18px; } .ls-halves .cq { font-size: 11px; vertical-align: 7px; } .ls-halves button.on .cs { color: var(--paper); }
  .ls-roots, .ls-quals { display: flex; flex-wrap: wrap; gap: 6px; } .ls-roots .kb { min-width: 46px; min-height: 42px; font-size: 15px; } .ls-quals .kb { min-width: 58px; min-height: 42px; }
  .ls-type { display: flex; gap: 8px; } .ls-type input { flex: 1; min-height: 42px; font: 700 16px var(--mono); }
  .ls-edit .ebtns .btn { min-height: 38px; padding: 2px 12px; font-size: 13px; }
  .ls-err { margin: 0; color: var(--red2); font-weight: 700; font-size: 14px; }
  .ls-ask { border: 3px solid var(--ink); border-radius: 12px; background: #FFF6CF; padding: 10px 12px; margin: 6px 0 12px; } .ls-ask p { margin: 0 0 8px; font-weight: 700; }
  .ls-hint { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 10px; } .ls-hint .cr { font-size: 16px; } .ls-hint .cq { font-size: 10px; vertical-align: 6px; }
  .ls-typeall textarea { width: 100%; font: 700 17px/1.7 var(--mono); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--ink); resize: vertical; }
  @media (max-width: 560px) {
    .ls-bar { min-height: 62px; padding: 14px 4px 6px 6px; } .cr { font-size: 23px; } .cq { font-size: 13px; vertical-align: 9px; }
    .ls-two { flex-direction: column; align-items: flex-start; gap: 0; } .ls-two .cr { font-size: 17px; } .ls-two .cq { font-size: 10px; vertical-align: 6px; }
    .ls-meta { justify-content: flex-start; } .ls-meta select { max-width: 100%; } .ls-roots .kb { min-width: 42px; }
    .ls-meta label:last-child { width: 100%; } .ls-meta label:last-child select { flex: 1; min-width: 0; }
  }

  /* Fret Hunt hub */
  .card.match.hub { width: min(720px, calc(100vw - 28px)); }
  .hubrow { display: flex; gap: 16px; align-items: flex-start; } .hubmain { flex: 1; min-width: 0; } .hubmap { flex: 0 0 190px; text-align: center; }
  .goldmap { width: 190px; height: auto; } .goldmap .gm-s, .goldmap .gm-f { font: 700 8px var(--mono); fill: #6E6255; text-anchor: middle; }
  .chip.nextc { background: var(--ball); box-shadow: 0 2px 0 var(--ink); }
  .stackline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .rolechip { padding: 4px 12px; border: 2px solid var(--ink); border-radius: 10px; font-weight: 900; font-size: 18px; } .rolechip small { font-size: 12px; font-weight: 700; }
  @media (max-height: 420px) { .card.match.hub .tip { font-size: 14px; padding: 6px 10px; } .hubmap { flex-basis: 160px; } .goldmap { width: 160px; } .card.match.hub .boxes .court-pick { padding: 4px 8px; } }
  @media (max-width: 600px) { .hubrow { flex-direction: column; } .hubmap { align-self: center; } }
</style>

/* ---------- Timing check: play along to 8 clicks; measure how late your notes are recognised ---------- */
const TIMECHK = { active: false, clicks: [], offsets: [], used: new Set(), tracker: null, prevRs: 0, endAt: 0, msg: '' };
function startTimingCheck() {
  if (!ctx || !mic) { TIMECHK.msg = 'The microphone needs to be on first.'; return; }
  const beat = 60 / 90, t0 = ctx.currentTime + 1.2;
  TIMECHK.clicks = []; TIMECHK.offsets = []; TIMECHK.used = new Set(); TIMECHK.tracker = new NoteTracker();
  for (let i = 0; i < 8; i++) {
    const at = t0 + i * beat, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = i % 4 ? 1000 : 1500; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.35, at + .002); g.gain.exponentialRampToValueAtTime(.001, at + .06);
    o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + .08); TIMECHK.clicks.push(at);
  }

}

  const C = TIMECHK; if (!C.active) return;
  if (rs > gate * 2 && rs > C.prevRs * 1.5) C.tracker.markAttack(t); C.prevRs = rs;   // a fresh pick lets the same note count again
  const f = r < gate ? null : detectPitch(mic.buf, ctx.sampleRate, 75, 1400);

    C.clicks.forEach((c, i) => { if (!C.used.has(i) && Math.abs(now - c) < d) { d = Math.abs(now - c); best = i; } });

}

  const acc = r => r.length ? [...r].filter(c => c === '1').length / r.length : 0;

  const bar = (v, col) => `<span class="meter"><i style="width:${Math.round(v * 100)}%;background:${col}"></i></span>`;
  const sc = k => D.sc[k] || { n: 0, ok: 0 };

  const timing = !D.tim.n ? 'Not enough shots yet.' : avg > .04 ? `You tend to play a touch late, about ${Math.round(avg * 1000)} ms after the beat. Try landing your note as the ball touches the paddle.` : avg < -.04 ? `You tend to jump in early, about ${Math.round(-avg * 1000)} ms before the beat. Let the ball come to you.` : 'Right on the beat. Your timing is solid.';
  const rows = [
    ['Volleys with the 3rd', sc('volley')], ['Pop-ups you put away', sc('popup')], ['Spikes you saved with the root', sc('save')], ['Fret Hunt notes', sc('note')],
  ].filter(([, v]) => v.n).map(([l, v]) => `<div class="srow"><span class="sl">${l}</span>${bar(v.ok / v.n, v.ok / v.n >= .8 ? '#06A66B' : v.ok / v.n >= .6 ? '#E0A11B' : '#E5483F')}<b>${pct(v.ok, v.n)}%</b><small>${v.n} balls</small></div>`).join('');

    return `<rect x="${i * 24 + 4}" y="${80 - h}" width="16" height="${h}" rx="3" fill="${!e.n ? '#E3DCCB' : a >= .8 ? '#06A66B' : a >= .6 ? '#E0A11B' : '#E5483F'}"><title>${d}: ${e.n} balls, ${pct(e.ok, e.n)}%</title></rect>`; }).join('');

  const tw = wk(7, 14), lw = wk(0, 7);
  const growth = tw.n && lw.n ? `This week <b>${pct(tw.ok, tw.n)}%</b>, last week ${pct(lw.ok, lw.n)}%. ${pct(tw.ok, tw.n) > pct(lw.ok, lw.n) ? 'You’re getting better.' : pct(tw.ok, tw.n) === pct(lw.ok, lw.n) ? 'Holding steady.' : 'A dip: keep at it.'}` : tw.n ? `<b>${tw.n}</b> balls played this week, ${pct(tw.ok, tw.n)}% landed.` : 'Nothing played this week yet.';
  return head + `
    <div class="tiles">

      <div class="tile"><b>${pct(D.ok, D.shots)}%</b><span>of ${D.shots} balls landed</span></div>

    <h3>Notes you keep missing</h3>
    ${missing.length ? `<div class="missnotes">${missing.map(x => `<div class="nrow"><b>${noteName(x.p)}</b>${bar(x.miss, '#E5483F')}<small>missed ${Math.round(x.miss * 100)}% of ${x.n}</small></div>`).join('')}</div><p class="line muted">A Fret Hunt in Free Play drills these.</p>` : '<p class="line muted">Nothing stands out. Every note you’ve been asked for, you mostly find.</p>'}
    <h3>How you play</h3>
    <div class="srows">${rows}</div>

    ${flowLine}

    <h3>Your last two weeks</h3>

    <p class="line">${growth}</p>
  </div></div></div></div>`;
}

function tileMapSvg(club, box) {   // your gold map of the box: every spot of this club's chord notes
  const keys = new Map(); for (const c of clubChords(club)) for (const sp of chordSpots(box, c)) keys.set(sp.key, sp);
  const cw = 34, sh = 15, x0 = 24, y0 = 12; let s = `<svg class="goldmap" viewBox="0 0 ${x0 + 4 * cw + 6} ${y0 + sh * 5 + 22}" role="img" aria-label="Your gold map">`;
  s += `<rect x="${x0}" y="${y0 - 5}" width="${4 * cw}" height="${sh * 5 + 10}" fill="#E9D2A8"/>`;
  for (let i = 0; i < 6; i++) s += `<line x1="${x0}" x2="${x0 + 4 * cw}" y1="${y0 + i * sh}" y2="${y0 + i * sh}" stroke="#8A7A62" stroke-width="${i > 2 ? 1.6 : 1}"/><text x="${x0 - 10}" y="${y0 + i * sh + 4}" class="gm-s">${'eBGDAE'[i]}</text>`;
  for (let k = 0; k <= 4; k++) { if (box === 0 && k === 0) continue; s += `<rect x="${x0 + k * cw - (box === 0 && k === 1 ? 2.5 : .8)}" y="${y0 - 5}" width="${box === 0 && k === 1 ? 5 : 1.6}" height="${sh * 5 + 10}" fill="${box === 0 && k === 1 ? '#221a14' : '#8A7A62'}"/>`; }
  for (let k = 0; k < 4; k++) s += `<text x="${x0 + k * cw + cw / 2}" y="${y0 + sh * 5 + 18}" class="gm-f">${box + k}</text>`;
  for (const sp of keys.values()) { const st = spotStrength(box, sp.key), x = x0 + (sp.f - box) * cw + cw / 2, y = y0 + (5 - sp.s) * sh;
    s += st >= 3 ? `<circle cx="${x}" cy="${y}" r="6.5" fill="#FFC83D" stroke="#221a14" stroke-width="1.6"/>` : st > 0 ? `<circle cx="${x}" cy="${y}" r="6" fill="#FFF3C4" stroke="#B89A4A" stroke-width="1.6"/>` : `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="#B9A98E" stroke-width="1.6" stroke-dasharray="2 2"/>`; }
  return s + '</svg>';
}

// ---------- shrinking the art for the file (same pixels, fewer bytes) ----------
/* Drawings and painted layers are kept as PNGs while you edit. When the game file, a backup or a publish
   is made, each one is re-saved as a lossless WebP and only kept if (1) it really is smaller and (2) it
   decodes to the same picture (checked pixel by pixel). Anything that fails either test stays a PNG.
   The art in the editor itself isn't touched, so nothing changes while you work. */
const ART_SHRUNK = new Map();   // png key -> smaller copy (or the png itself, if WebP didn't help)
const artKey = src => src.length + ':' + src.slice(-96);
function artDecode(src) {
  return new Promise(res => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    res({ c, d: g.getImageData(0, 0, c.width, c.height).data }); }; img.onerror = () => res(null); img.src = src; });
}
function artSame(a, b) {   // compared as they're drawn (colour x opacity), so invisible fully transparent pixels don't count
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i += 4) {
    const aa = a[i + 3], ba = b[i + 3]; if (Math.abs(aa - ba) > 1) return false; if (!aa && !ba) continue;
    for (let k = 0; k < 3; k++) if (Math.abs(a[i + k] * aa - b[i + k] * ba) / 255 > 1.5) return false;
  }
  return true;
}
async function artShrinkOne(src) {
  if (typeof src !== 'string' || !src.startsWith('data:image/png')) return src;
  const key = artKey(src); if (ART_SHRUNK.has(key)) return ART_SHRUNK.get(key);
  let out = src;
  try {
    const orig = await artDecode(src);
    if (orig) {
      const webp = orig.c.toDataURL('image/webp', 1);   // (browsers that can't make WebP hand back a PNG: skipped)
      if (webp.startsWith('data:image/webp') && webp.length < src.length * .97) {
        const back = await artDecode(webp);
        if (back && artSame(orig.d, back.d)) out = webp;
      }
    }
  } catch {}
  ART_SHRUNK.set(key, out); return out;
}
// A copy of ART with every picture as small as it can be without looking any different.
async function artForFile(art) {
  const copy = JSON.parse(JSON.stringify(art)); let before = 0, after = 0;
  const jobs = [];
  for (const a of Object.values(copy.assets || {})) jobs.push(async () => { before += (a.src || '').length; a.src = await artShrinkOne(a.src); after += (a.src || '').length; });
  for (const store of ['scenes', 'tiles']) for (const sc of Object.values(copy[store] || {})) if (sc && sc.paint)
    jobs.push(async () => { before += sc.paint.length; sc.paint = await artShrinkOne(sc.paint); after += sc.paint.length; });
  for (const j of jobs) await j();   // one at a time: big painted layers use a lot of memory
  return { art: copy, saved: before - after, before };
}

  if (el.id === 'ls-title') { if (e.type === 'change') { lsMut(t2 => { t2.name = el.value.trim() || 'Untitled'; }); } return true; }
  if (el.id === 'ls-bpm') { if (e.type === 'change') { const v = Math.max(50, Math.min(180, Math.round(+el.value || t.bpm))); lsMut(t2 => { t2.bpm = v; }); edRender(); } return true; }
  if (el.id === 'ls-style') { if (e.type === 'change') { lsMut(t2 => { t2.style = el.value; }); edRender(); } return true; }
  if (el.id === 'ls-root') { if (e.type === 'change') { const k = +el.value; if (k !== t.root) { EDV.keyAsk = { root: k, minor: t.minor }; } edRender(); } return true; }
  if (el.id === 'ls-text' || el.id === 'ls-chart') return true;

}
addEventListener('keydown', e => {   // Enter in the bar's text box sets it; arrows step through bars
  if (!ED_ON || EDV.tab !== 'tracks' || EDV.track === null) return;
  if (e.target.id === 'ls-text' && e.key === 'Enter') { e.preventDefault(); lsSetText(); edRender(); setTimeout(() => document.getElementById('ls-text')?.select(), 0); }

/* =====================================================================
   PUBLISH: send your work straight to the live game. The editor writes content.json into your GitHub
   repo (beside index.html) through GitHub's own API, as a normal commit you can always roll back.
   GitHub Pages serves it within a minute or two; the game (and a future app) picks it up on its next start.
   The access token lives only in this browser's storage, never in anything published.
   ===================================================================== */
const PUB_KEY = 'fretball-publish';
const PUB = (() => {
  let s = {}; try { s = JSON.parse(localStorage.getItem(PUB_KEY)) || {}; } catch {}
  if (!s.owner && /\.github\.io$/.test(location.hostname)) { s.owner = location.hostname.split('.')[0]; s.repo = location.pathname.split('/').filter(Boolean)[0] || `${s.owner}.github.io`; }
  return { owner: '', repo: '', branch: 'main', path: 'content.json', token: '', verified: false, lastRev: 0, lastHash: '', lastAt: '', ...s };
})();
const pubSave = () => { try { localStorage.setItem(PUB_KEY, JSON.stringify(PUB)); } catch {} };
const pubReady = () => !!(PUB.owner && PUB.repo && PUB.token);
const pubHash = d => { const s = JSON.stringify(d); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h + ':' + s.length; };
const pubUnpublished = () => !PUB.lastHash || pubHash({ ...ED, art: ART, rev: 0 }) !== PUB.lastHash;
async function gh(method, path, body) {
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(PUB.owner)}/${encodeURIComponent(PUB.repo)}${path}`, {
    method, headers: { Authorization: `Bearer ${PUB.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((j && j.message) || r.statusText); e.status = r.status; throw e; }
  return j;
}
const ghWhy = e => e.status === 401 ? 'GitHub didn’t accept the token. It may be mistyped or expired.'
  : e.status === 403 ? 'The token can’t write to this repo. Give it “Contents: Read and write” for this repository.'
  : e.status === 404 ? `GitHub can’t find ${PUB.owner}/${PUB.repo}${PUB.branch ? ` (branch “${PUB.branch}”)` : ''}, or the token can’t see it.`
  : e.status === 422 ? 'GitHub turned the change down (someone else changed the repo at the same moment?). Try again.'
  : !navigator.onLine ? 'You’re offline.' : `Something went wrong talking to GitHub: ${e.message}`;
function b64utf8(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
async function pubTest() {
  try { const r = await gh('GET', ''); await gh('GET', `/git/ref/heads/${encodeURIComponent(PUB.branch)}`);
    return r.permissions && r.permissions.push === false ? { ok: false, msg: 'Connected, but this token can only read the repo. Give it “Contents: Read and write”.' } : { ok: true, msg: `Connected to ${r.full_name}. Ready to publish.` }; }
  catch (e) { return { ok: false, msg: ghWhy(e) }; }
}
// One commit that writes content.json (Git's data API: it handles big files, unlike the simpler contents API).
async function pubCommit(text, message) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const ref = await gh('GET', `/git/ref/heads/${encodeURIComponent(PUB.branch)}`), head = ref.object.sha;
    const commit = await gh('GET', `/git/commits/${head}`);
    const blob = await gh('POST', '/git/blobs', { content: b64utf8(text), encoding: 'base64' });
    const tree = await gh('POST', '/git/trees', { base_tree: commit.tree.sha, tree: [{ path: PUB.path || 'content.json', mode: '100644', type: 'blob', sha: blob.sha }] });
    const next = await gh('POST', '/git/commits', { message, tree: tree.sha, parents: [head] });
    try { await gh('PATCH', `/git/refs/heads/${encodeURIComponent(PUB.branch)}`, { sha: next.sha, force: false }); return next.sha; }
    catch (e) { if (e.status !== 422 || attempt) throw e; }   // the branch moved under us: start again from its new tip
  }
}
let pubBusy = false;
async function pubPublish() {
  if (pubBusy) return; if (!pubReady()) { EDV.tab = 'more'; EDV.pubMsg = 'Set up publishing first (it takes a minute, once).'; edRender(); return; }
  const problems = [];
  ED.clubs.forEach(c => { if (!c.matches.length) problems.push(`${c.name} has no matches`); c.matches.forEach(m => { if (!m.tracks.length) problems.push(`${c.name}: “${m.title}” has no tracks`); if (!m.keys.length) problems.push(`${c.name}: “${m.title}” has no keys`); }); });
  if (problems.length) { toast('Fix first: ' + problems[0]); return; }
  pubBusy = true; EDV.pubConfirm = false; paintFlush(); edRender();
  edStatus('Shrinking the art…');
  const small = await artForFile(ART);
  const rev = Math.max(LIVE_REV, PUB.lastRev || 0, ED.rev || 0) + 1, data = { ...ED, art: small.art, rev };
  const content = { format: 'fretball-content', v: 1, minApp: FB_APP_VERSION, rev, published: new Date().toISOString(), data };
  const text = JSON.stringify(content);
  edStatus(`Publishing… (${(text.length / 1048576).toFixed(1)} MB)`);
  try {
    await pubCommit(text, `Publish from the Fretball Editor (#${rev})`);
    ED.rev = rev; edSave();
    Object.assign(PUB, { lastRev: rev, lastHash: pubHash({ ...ED, art: ART, rev: 0 }), lastAt: content.published }); pubSave();
    IDB.set('content-cache', content).catch(() => {});   // this device has it straight away
    EDV.pubMsg = null; toast(`Published! Your game updates in a minute or two (#${rev}).`);
  } catch (e) { EDV.pubMsg = ghWhy(e); toast('Couldn’t publish. ' + ghWhy(e)); }
  pubBusy = false; edRender();
}
// The More tab: setting it up.
function pubPanel() {
  const when = PUB.lastAt ? new Date(PUB.lastAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : null;
  return `<h4>Publishing to your game</h4>
    ${pubReady() ? `<p class="hint">Publishing to <b>${esc(PUB.owner)}/${esc(PUB.repo)}</b>${PUB.branch !== 'main' ? ` (branch ${esc(PUB.branch)})` : ''} as <b>${esc(PUB.path)}</b>. ${when ? `Last published ${when} (#${PUB.lastRev}).` : 'Not published from here yet.'}</p>` : `<p class="hint">Connect the editor to your GitHub repo once, then the <b>Publish</b> button sends your work straight to the live game.</p>`}
    ${EDV.pubMsg ? `<p class="ls-err" role="alert">${esc(EDV.pubMsg)}</p>` : ''}
    <details class="es" ${pubReady() && PUB.verified ? '' : 'open'}><summary>${pubReady() && PUB.verified ? 'Connection settings' : 'Set up publishing'}</summary><div class="esb">
      <ol class="pubsteps"><li>On GitHub: your picture → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
        <li>Under <b>Repository access</b>, pick <b>Only select repositories</b> and choose your game’s repo.</li>
        <li>Under <b>Permissions</b> → <b>Repository permissions</b>, set <b>Contents</b> to <b>Read and write</b>. Generate it, copy it, and paste it below.</li></ol>
      <div class="erowf"><label class="ef"><span>GitHub user</span><input type="text" id="pub-owner" value="${esc(PUB.owner)}" autocomplete="off" spellcheck="false"></label><label class="ef"><span>Repo</span><input type="text" id="pub-repo" value="${esc(PUB.repo)}" autocomplete="off" spellcheck="false"></label></div>
      <div class="erowf"><label class="ef"><span>Branch</span><input type="text" id="pub-branch" value="${esc(PUB.branch)}" autocomplete="off" spellcheck="false"></label><label class="ef"><span>File</span><input type="text" id="pub-path" value="${esc(PUB.path)}" autocomplete="off" spellcheck="false"></label></div>
      <label class="ef"><span>Access token</span><input type="password" id="pub-token" value="${esc(PUB.token)}" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label>
      <p class="hint">The token is kept only in this browser, never in the game or anything published. Treat it like a password: if it ever leaks, delete it on GitHub and make a new one.</p>
      <div class="ebtns"><button class="btn primary" id="pub-save">Save and test</button>${PUB.token ? '<button class="btn" id="pub-forget">Forget the token</button>' : ''}</div>
    </div></details>`;
}
function pubClick(b, id) {
  if (id === 'ed-publish') { if (!pubReady()) { EDV.tab = 'more'; EDV.pubMsg = 'Set up publishing first (it takes a minute, once).'; } else EDV.pubConfirm = !EDV.pubConfirm; edRender(); return true; }
  if (id === 'pub-go') { pubPublish(); return true; }
  if (id === 'pub-cancel') { EDV.pubConfirm = false; edRender(); return true; }
  if (id === 'pub-save') {
    const v = k => (document.getElementById('pub-' + k).value || '').trim();
    Object.assign(PUB, { owner: v('owner').replace(/^https?:\/\/github\.com\//, '').split('/')[0], repo: v('repo').replace(/\.git$/, ''), branch: v('branch') || 'main', path: (v('path') || 'content.json').replace(/^\/+/, ''), token: v('token') }); pubSave();
    EDV.pubMsg = 'Testing the connection…'; edRender();
    PUB.verified = false; pubTest().then(r => { PUB.verified = r.ok; pubSave(); EDV.pubMsg = r.msg; edRender(); if (r.ok) toast(r.msg); });
    return true;
  }
  if (id === 'pub-forget') { PUB.token = ''; PUB.verified = false; pubSave(); EDV.pubMsg = 'Token forgotten. This browser can’t publish until you add one again.'; edRender(); return true; }
  if (id === 'ed-download') { edExport(); return true; }
  return false;
}

THEME = currentClub().id;

/* =====================================================================
   STARTING UP: which content to play. Fretball's clubs, courts, art and tracks can come from three places:
     1. content.json beside this page (what the Fretball Editor publishes),
     2. the last copy this device downloaded (so it works offline),
     3. the copy built into this file.
   When the site can be reached, its content.json is the live truth (so rolling it back on GitHub works);
   the copy saved on the device is only for when it can't. Either way, the built-in copy wins if it's newer
   (by its publish number, `rev`), and nothing is used that this version of the game can't play (`minApp`).
   The wait for the network is capped at 2.5 seconds.
   ===================================================================== */
const FB_APP_VERSION = 1;   // raise this when the game learns something content might need (a new band style, a new prop...)
(async function fbStart() {
  const pristine = '<!doctype html>\n' + document.documentElement.outerHTML;   // the page as written, before anything ran (the editor saves copies from it)
  const usable = c => c && c.format === 'fretball-content' && c.data && Array.isArray(c.data.clubs) && c.data.clubs.length && Array.isArray(c.data.tracks) && (c.minApp || 1) <= FB_APP_VERSION;
  const db = () => new Promise((res, rej) => { const r = indexedDB.open('fretball-studio', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idb = async (k, v) => { const d = await db(); return new Promise((res, rej) => { const tx = d.transaction('kv', v === undefined ? 'readonly' : 'readwrite'), st = tx.objectStore('kv'), q = v === undefined ? st.get(k) : st.put(v, k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
  let built = null; try { built = JSON.parse(document.getElementById('fb-data').textContent); } catch {}
  const cands = []; let reached = false;
  if (/^https?:/.test(location.protocol)) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(new URL('content.json', location.href).href + '?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
      clearTimeout(tm);
      if (r.ok) { const c = await r.json(); if (usable(c)) { reached = true; cands.push({ ...c, source: 'published' }); idb('content-cache', c).catch(() => {}); } else if (c && c.minApp > FB_APP_VERSION) console.warn('Fretball: the published content needs a newer version of the game; using the last content that works.'); }
    } catch {}
  }
  if (!reached) try { const c = await idb('content-cache'); if (usable(c)) cands.push({ ...c, source: 'saved on this device' }); } catch {}
  if (built) cands.push({ format: 'fretball-content', rev: built.rev || 0, data: built, source: 'built in' });
  const live = cands.reduce((a, c) => !a || (c.rev || 0) > (a.rev || 0) ? c : a, null) || { rev: 0, data: { tracks: [], clubs: [] }, source: 'none' };
  document.getElementById('splash')?.remove();
  FB_BOOT({ data: live.data, rev: live.rev || 0, source: live.source, published: live.published || null }, pristine);
})();
