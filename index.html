<html lang="en">
<head>
<meta charset="UTF-8">

<title>Guitar Sports Resort</title>
<style>

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15120f; --fg: #f1e8da; --muted: #a89a8b; --panel: #211b16; --line: #3b322a; --btn: #f1e8da; --btn-fg: #15120f; --accent: #e0b25e; --good: #7cc48e; --warn: #e38b7a; --paper: #2a231c; }
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 19px; margin: 0; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #bfd8e6; }
  .panel { margin-top: 12px; padding: 16px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .who { font-weight: 700; color: var(--accent); }
  .msg { margin: 0 0 12px; font-size: 18px; }
  .muted { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font: inherit; font-size: 16px; padding: 11px 18px; min-height: 46px; border-radius: 8px; border: 2px solid var(--btn); background: var(--btn); color: var(--btn-fg); cursor: pointer; user-select: none; -webkit-user-select: none; }
  button.ghost { background: transparent; color: var(--fg); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .live { font-size: 24px; font-weight: 700; min-height: 1.5em; margin: 4px 0 12px; word-break: break-word; }
  .score { font-size: 42px; font-weight: 800; line-height: 1.1; }
  .tries { font-size: 14px; color: var(--muted); }
  .good { color: var(--good); } .warn { color: var(--warn); }
  .clue { margin: 10px 0 12px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--paper); font-style: italic; }
  .settings { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .notebook { margin-top: 12px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-page { margin-top: 12px; padding: 18px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
  /* Map, Tuner and Notebook open as a large window over the game */
  #map, #tuner, #notebook { position: fixed; top: 4vh; bottom: 4vh; left: max(3vw, calc(50vw - 560px)); right: max(3vw, calc(50vw - 560px));
    z-index: 50; margin: 0; overflow: auto; padding: 26px 28px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0,0,0,.4); }
  #overlayBg { position: fixed; inset: 0; z-index: 49; background: rgba(20,16,12,.55); }
  #overlayClose { position: fixed; z-index: 51; top: calc(4vh + 10px); right: calc(max(3vw, calc(50vw - 560px)) + 12px); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; padding: 0; }
  [hidden] { display: none !important; }
  .tool-page h2 { font-size: 20px; margin: 0 0 4px; }
  .map-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 10px; }
  .map-tabs button { min-height: 38px; padding: 6px 12px; font-size: 15px; }
  .map-wrap { overflow-x: auto; }
  .map-wrap svg { display: block; width: 100%; min-width: 520px; height: auto; border-radius: 10px; }
  @keyframes here { 0% { r: 30; opacity: .9; } 100% { r: 54; opacity: 0; } }
  .here-ring { animation: here 1.6s ease-out infinite; }
  .tuner-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tuner-wrap canvas { width: 100%; max-width: 420px; height: auto; background: transparent; border: 0; box-shadow: none; aspect-ratio: auto; }
  .strings { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .strings span { min-width: 44px; text-align: center; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
  .strings span.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .page { margin-top: 12px; padding: 18px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
  .page h2 { font-size: 20px; margin: 0; }
  .page h3 { font-size: 15px; margin: 14px 0 6px; color: var(--muted); font-weight: 400; letter-spacing: .04em; }
  pre { margin: 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 14px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>

    if (G.nearId !== 'exit:' + ex.id) { G.nearId = 'exit:' + ex.id; G.dwell = 0; }
    if (G.vx < 12) G.dwell += dt; else G.dwell = 0;
    if (G.dwell >= DWELL) { G.dwell = 0; enterLocation(ex.to, { x: ex.at, door: ex.door }); }
    return;
  }
  if (G.ignoreId) {
    const e = ENCOUNTERS.find(e => e.id === G.ignoreId), bf = BELFRIES.find(b => 'belfry:' + b.enc.id === G.ignoreId);
    const at = bf ? bf.x : e ? e.x : null;
    if (at === null || Math.abs(G.x - at) > 260) G.ignoreId = '';
  }
  const bf = belfryAt(G.x);
  if (bf) {
    if (G.nearId !== 'belfry') { G.nearId = 'belfry'; G.dwell = 0; }
    if (G.vx < 12) G.dwell += dt; else G.dwell = 0;
    if (G.dwell >= DWELL) enterBelfry(bf);
    return;
  }
  const i = encounterAt(G.x);
  if (i < 0) { G.dwell = 0; G.nearId = ''; return; }
  const id = ENCOUNTERS[i].id;
  if (id !== G.nearId) { G.nearId = id; G.dwell = 0; }
  // Standing still is the input. Keep playing and you simply walk on by.
  if (G.vx < 12) G.dwell += dt; else G.dwell = 0;
  if (G.dwell >= DWELL) {
    G.dwell = 0; G.facing = 1; G.y = 0; G.onPlat = false;
    ACTIVE = i; TARGET = targetOf(ENCOUNTERS[i].motif);
    G.tries = 0; G.lastScore = null; G.lastNotes = []; G.best = null;
    if (G.solved.has(ENCOUNTERS[i].id)) { G.vx = 0; stopBacking(); startNoteLesson(ENCOUNTERS[i]); } // back for a lesson
    else meet();
  }
}
function toast(msg) { G.toast = msg; G.toastAt = performance.now() / 1000; }
function onChord(ch, t) {
  lastChord = { name: ch.name, action: ch.action, t };
  if (G.state !== 'walking') return;
  if (ch.action === 'turn') G.facing = -G.facing;
}
function jump() {
  const grounded = G.y === 0 || G.onPlat;
  if (!grounded) return;
  G.vy = 760; G.onPlat = false; G.airPush = 1;
}
function chime() {
  if (!ctx) return;
  const t = ctx.currentTime + .02;
  [86, 90, 93].forEach((m, i) => pluck(m, t + i * .07, .5, .5, ctx.destination, true));
}

function onNote(note, t) {
  if (G.state === 'teaching') { teachNote(note, t); return; }
  if (G.state === 'ringing') { belfryNote(note, t); return; }
  if (G.state === 'race') { raceNote(note, t); return; }
  if (G.state === 'runner') { runnerNote(note, t); return; }
  if (G.state === 'pickle') { pickleNote(note, t); return; }
  if (G.state === 'golf') { golfNote(note, t); return; }
  if (G.state === 'surf') { surfNote(note, t); return; }
  if (G.state === 'shop') { shopNote(note, t); return; }
  if (G.state === 'walking') {
    const ok = KEY.has(pc(note.midi));
    const tones = soundingTones();
    const sweet = ok && !!tones && tones.includes(pc(note.midi));
    G.recent.push({ name: note.name, ok, sweet }); if (G.recent.length > 6) G.recent.shift();
    if (ok) {
      G.lastNote = t; G.noteTimes.push(t);
      if (sweet) G.boost = Math.min(1, G.boost + .45); // chord tones: a little extra speed
    }
    if (LOC.comes_alive) G.life = Math.max(0, Math.min(1, (G.life || 0) + (ok ? (sweet ? .05 : .03) : -.04)));
    if (typeof worldNote === 'function') worldNote(note, ok, t);
  } else if (G.state === 'recording') {
    const el = document.getElementById('live'); if (el) el.textContent = recTracker.notes.map(n => n.name).join(' → ');
  }
}

async function start(skip) {
  await audio();
  if (!mic) { try { await initMic(); } catch { mic = null; } } // the tuner may already have switched it on
  if (TUNER.open) closeTuner();
  G.practice = false;
  enterLocation(typeof skip === 'string' ? skip : skip === true ? CONTENT.game.skip_to : CONTENT.game.start, { arrived: true });
}
function meet() {
  G.vx = 0; stopBacking();
  G.said = CASE.greet;
  G.armTok++;
  if (!CASE.lock) setTimeout(lorenzoPlays, 1400);
  else if (CASE.lock !== 'bells') armListen(1.0); // a bell lock is opened out in the world, not here           // the door plays nothing: you can start whenever you like
  G.state = 'meeting'; render();
}
/* Listening starts on its own; a try only counts once you've actually played a note,
   and ends on its own when you pause. */
const SILENCE_END = 2.0;         // seconds of no new notes before the attempt is scored
function armListen(delay) {
  const tok = ++G.armTok;
  setTimeout(() => {
    if (tok === G.armTok && (G.state === 'meeting' || G.state === 'npcPlaying' || G.state === 'result')) startAttempt();
  }, delay * 1000);
}
function cancelAttempt() {
  if (G.state !== 'recording') return;
  stopRecorder(); recTracker = null; G.finishing = true;
  G.state = 'meeting';
}
function hearAgain() { cancelAttempt(); lorenzoPlays(); }
function autoFinish(t) {
  // Haven't played anything for a while? They play it again for you; at the belfry, the bells ring again.
  if (G.state === 'ringing' && t - G.belfryIdleAt > 12) { G.belfryIdleAt = t; chimeBelfry(); }
  lessonIdle(t);
  if (G.state !== 'recording' || !recTracker || G.finishing) return;
  const n = recTracker.notes.length;
  if (!n && !CASE.lock && t - G.lastNoteAt > 8) { hearAgain(); return; }
  if (n !== G.recCount) { G.recCount = n; G.lastNoteAt = t; }
  if (!n) return;                                   // nothing played yet: keep waiting, no try spent
  const quiet = !mic || mic.smooth < gate * 1.3;
  const since = t - G.lastNoteAt;
  if ((since > SILENCE_END && quiet) || since > SILENCE_END + 1.4 || n >= TARGET.length * 2 + 4) {
    G.finishing = true; finishAttempt();
  }
}
function lorenzoPlays() {
  if (G.state !== 'meeting' && G.state !== 'result') return;
  G.armTok++;
  const secs = playMotif();
  G.npcUntil = performance.now() / 1000 + secs;
  G.state = 'npcPlaying'; render();
  armListen(secs + .35);          // the moment they finish, it's your turn
}
function startAttempt() {
  if (G.state === 'recording') return;
  G.armTok++;
  recTracker = new NoteTracker(); startRecorder();
  G.finishing = false; G.recCount = 0; G.lastNoteAt = performance.now() / 1000;
  G.state = 'recording'; render();
}
async function finishAttempt(fakeNotes) {
  const notes = fakeNotes || (recTracker ? recTracker.notes : []);
  const blob = await stopRecorder();
  G.tries++;
  G.lastScore = score(TARGET, notes);
  G.lastNotes = notes;
  if (!G.best || G.lastScore > G.best.score) G.best = { score: G.lastScore, notes, blob };
  if (G.lastScore >= PASS) { await fileInNotebook(notes, blob, G.lastScore); G.solved.add(CASE.id); if (pendingLessons(CASE).length) startNoteLesson(CASE); else G.state = 'solved'; }
  else if (G.tries >= MAX_TRIES) G.state = 'failed';
  else { G.state = 'result'; armListen(2.6); }   // see your score, then you're straight back in
  render();
}
async function fileInNotebook(notes, blob, sc) {
  let take = null;
  if (blob && blob.size < 1500000) { try { take = await blobToDataUrl(blob); } catch { take = null; } }
  const page = {
    id: Date.now(), eid: CASE.id, case: CASE.title, place: CASE.place, from: CASE.npc, clue: CASE.clue,
    motif: MOTIF.name, notes: MOTIF.notes.map(n => nameOf(n[0])), playedNotes: notes.map(n => n.name),
    tab: tab(MOTIF.notes.map(n => n[0])), tune: MOTIF.notes, bpm: MOTIF.bpm, score: sc, take, date: new Date().toLocaleString(),
  };
  const key = p => p.eid || p.case;
  const pages = loadNotebook().filter(p => key(p) !== page.eid || p.score > sc);
  if (!pages.some(p => key(p) === page.eid)) pages.push(page);
  if (!saveNotebook(pages)) { page.take = null; saveNotebook(pages.map(p => p.id === page.id ? page : p)); }
  renderNotebook();
}
function carryOn() {
  G.armTok++;
  if (G.state === 'recording') { stopRecorder(); recTracker = null; G.finishing = true; }
  G.ignoreId = G.state === 'ringing' ? 'belfry:' + G.belfry.enc.id : G.state === 'solved' ? '' : CASE.id; // don't re-grab you on the spot
  G.state = 'walking'; G.vx = 0; G.dwell = 0; G.said = '';
  walkTracker = new NoteTracker(); startBacking(); render();
}
function resetScene() {
  if (COIN) COIN.got = false;
  Object.assign(G, { facing: 1, y: 0, vy: 0, onPlat: false, coins: 0, boost: 0, glow: 0, state: 'walking', x: LOC.start_x, vx: 0, tries: 0, lastScore: null, lastNotes: [], best: null, noteTimes: [], recent: [], said: '' });
  walkTracker = new NoteTracker(); startBacking(); render();
}


/* ---------- Locations ----------
   loadLocation sets up a location from its content without starting anything;
   enterLocation puts you in it. */
function loadLocation(id) {
  LOC = CONTENT.locations[id];
  KEY = new Set(LOC.key.pcs); GROUND = LOC.backing.ground; BACKING_BPM = LOC.backing.bpm;
  NAMES = LOC.key.flats ? FLAT_NAMES : SHARP_NAMES;
  NB_KEY = 'fret-detective-' + LOC.world + '-notebook';
  if (LOC.type === 'case' || LOC.type === 'stroll') {
    ENCOUNTERS = LOC.encounters; ACTIVE = 0; TARGET = ENCOUNTERS.length ? targetOf(ENCOUNTERS[0].motif) : [];
    const terr = LOC.props.find(p => p.type === 'terrace'), gold = LOC.props.find(p => p.type === 'golden-note');
    PLAT = terr ? { x0: terr.x, x1: terr.x + terr.width, h: terr.height } : null;
    COIN = gold ? { x: gold.x, h: gold.height ?? 40, got: false, at: 0 } : null;
    G.x = LOC.start_x; G.zone = 0;
    BELFRIES = ENCOUNTERS.filter(e => e.lock === 'bells').map(e => {
      e.rung = [];
      return { enc: e, x: e.belfry, bells: e.bells.map((b, i) => ({ midi: b.midi, pc: pc(b.midi), x: e.belfry + (i - (e.bells.length - 1) / 2) * 92, rungAt: -9, chimedAt: -9 })) };
    });
  }
}
function enterLocation(id, o = {}) {
  // Through a door the band plays on (it's the same place), with a short fade and the door's sound.
  const through = o.door && backing.on;
  if (!through) stopBacking();
  if (!o.door) G.life = 0;   // a new place starts quiet; through a door it's the same place, still as alive as you left it
  loadLocation(id);
  if (typeof startAmbience === 'function') startAmbience(LOC.ambience || []);   // (rides have none: the crickets stay behind)
  Object.assign(G, { y: 0, vy: 0, vx: 0, cam: 0, facing: 1, recent: [], noteTimes: [], lastNote: -9, onPlat: false, dwell: 0, ignoreId: '' });
  walkTracker = new NoteTracker();
  discover(LOC.id, LOC.zones?.[0]?.name);
  mapWorld = LOC.world; if (!mapEl.hidden) renderMap();
  if (LOC.type === 'lesson') { beginLesson(); return; }
  if (LOC.type === 'race') { beginRace(); return; }
  if (LOC.type === 'runner') { beginRunner(); return; }
  if (LOC.type === 'pickleball') { beginPickle(); return; }
  if (LOC.type === 'golf') { beginGolf(); return; }
  if (LOC.type === 'surf') { beginSurf(); return; }
  G.x = o.x ?? LOC.start_x;
  if (o.arrived) { PRO.arriveAt = performance.now() / 1000; toast(LOC.name); }
  if (o.door) { G.doorAt = performance.now() / 1000; G.cam = Math.max(0, G.x - 330); toast(LOC.name); if (typeof doorSound === 'function') doorSound(); }
  G.state = 'walking'; if (!through) startBacking(); render(); renderNotebook();
}

/* ---------- Bell locks ----------
   The bells hang together in a belfry. Stop beneath it and the guitar stops walking
   Jo and rings bells instead: each note rings the bell with that pitch. Ring the lock's
   tune in order (having learned what it requires) and it opens. */
let BELFRIES = [];
const belfryAt = x => BELFRIES.find(b => !G.solved.has(b.enc.id) && Math.abs(x - b.x) < 130 && G.ignoreId !== 'belfry:' + b.enc.id);
function enterBelfry(bf) {
  G.belfry = bf; G.vx = 0; G.dwell = 0; G.state = 'ringing'; stopBacking();
  bf.enc.rung = []; G.belfryIdleAt = performance.now() / 1000; render(); chimeBelfry();
}
// The bells introduce themselves, left to right, so you can hear what each one is.
function chimeBelfry() {
  const bf = G.belfry; if (!bf) return;
  bf.bells.forEach((b, i) => setTimeout(() => { if (G.state === 'ringing') { b.chimedAt = performance.now() / 1000; bell(b.midi, .3); } }, 500 + i * 650));
}
function belfryNote(note, t) {
  const bf = G.belfry, p = pc(note.midi);
  const b = bf.bells.find(b => b.pc === p);
  if (echoCancel && b && t - Math.max(b.rungAt, b.chimedAt) < .6) return; // on speakers, don't hear a bell's own ring as you
  if (!b) { knock(); bf.enc.rung.push(-1); render(); return; } // a note no bell has breaks the tune
  if (t - b.rungAt < .3) return; // the same note heard twice from one pluck: one ring
  b.rungAt = t; bell(b.midi, .5); G.belfryIdleAt = t;
  const e = bf.enc; e.rung.push(p); if (e.rung.length > 32) e.rung.shift();
  render();
  const want = e.tune.map(pc), tail = e.rung.slice(-want.length);
  if (!G.solved.has(e.id) && available(e) && tail.length === want.length && tail.every((q, i) => q === want[i])) openWithBells(e);
}
function openWithBells(e) {
  G.solved.add(e.id);
  setTimeout(async () => {                                         // let the last bell ring out first
    ACTIVE = ENCOUNTERS.indexOf(e); TARGET = targetOf(e.motif);
    G.lastScore = null; G.tries = 0; G.vx = 0;
    chime();
    await fileInNotebook(e.tune.map(m => ({ midi: m, name: nameOf(m) })), null, 100);
    G.state = 'solved'; render();
  }, 1100);
}

/* ---------- Chucks ----------
   Walking: one chuck turns Jo around. Anywhere else: two chucks leave (walk away,
   carry on, leave the race). A single chuck while you're playing back a lick is ignored. */
function onChuck(t) {
  if (typeof APP !== 'undefined' && APP) return;   // the sports aren't played with chucks: only notes count
  const double = t - G.lastChuck < .7;
  G.lastChuck = double ? -9 : t; G.chuckAt = t;
  if (G.state === 'walking') { G.facing = -G.facing; lastChord = { name: 'chuck', action: 'turn', t }; return; }
  if (!double) { G.chuckHintAt = t; return; }
  const s = G.state;
  if (['meeting', 'npcPlaying', 'recording', 'result', 'failed', 'solved', 'ringing', 'teaching'].includes(s)) carryOn();
  else if (s === 'race' && ['intro', 'won', 'lost'].includes(RACE.phase)) leaveRace();
  else if (s === 'story') nextPanel();
  else if (s === 'shopTalk') nextTalk();
}

/* =====================================================================
   9. DRAWING (side-view characters, layered scene, lighting)
   ===================================================================== */
const cv = document.getElementById('game'), c2 = cv.getContext('2d');
let VW = 960; const VH = 540, GROUND_Y = 488, CHAR_S = .56;
// App mode: the canvas fills the phone, so VW follows its shape. Scenes laid out at 960 wide are centred on a stage
// (STAGE_X is how far it's shifted right); HUD text keeps clear of the notch (SAFE, in canvas units).
let STAGE_X = 0, STAGE_Y = 0, STAGE_S = 1; const SAFE = { l: 0, r: 0 };
// Begin drawing a scene laid out 960 x 540: centred on a wider screen, shrunk to fit a narrower one.
function stageBegin() {
  c2.save();
  if (VW >= 960) { STAGE_S = 1; STAGE_X = (VW - 960) / 2; STAGE_Y = 0; c2.translate(STAGE_X, 0); }
  else { STAGE_S = VW / 960; STAGE_X = 0; STAGE_Y = (VH - VH * STAGE_S) / 2; c2.translate(0, STAGE_Y); c2.scale(STAGE_S, STAGE_S); }
}
function stageEnd() { c2.restore(); STAGE_X = 0; STAGE_Y = 0; STAGE_S = 1; }
// Screen edges, in the stage's own units: the left edge, the full width, and the HUD's safe left / right / centre.
const SL = () => -STAGE_X / STAGE_S, SW = () => VW / STAGE_S;
const HL = () => (24 + SAFE.l - STAGE_X) / STAGE_S, HR = () => (VW - 24 - SAFE.r - STAGE_X) / STAGE_S, CX = () => (VW / 2 - STAGE_X) / STAGE_S;
(function fit() { const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = VW * dpr; cv.height = VH * dpr; c2.setTransform(dpr, 0, 0, dpr, 0, 0); })();

const OUT = '#1e1712';
function fs(path, fill, lw = 5) { c2.fillStyle = fill; c2.fill(path); if (lw) { c2.lineWidth = lw; c2.strokeStyle = OUT; c2.lineJoin = 'round'; c2.stroke(path); } }
function circ(x, y, r, fill, lw = 5) { const p = new Path2D(); p.arc(x, y, r, 0, Math.PI * 2); fs(p, fill, lw); }
function ell(x, y, rx, ry, fill, lw = 5, rot = 0) { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); fs(p, fill, lw); }
function rrect(x, y, w, h, r, fill, lw = 5) { const p = new Path2D(); if (p.roundRect) p.roundRect(x, y, w, h, r); else p.rect(x, y, w, h); fs(p, fill, lw); }
function poly(pts, fill, lw = 5) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); fs(p, fill, lw); }
function line(pts, color, w) { c2.beginPath(); pts.forEach(([x, y], i) => i ? c2.lineTo(x, y) : c2.moveTo(x, y)); c2.lineCap = 'round'; c2.lineJoin = 'round'; c2.strokeStyle = color; c2.lineWidth = w; c2.stroke(); }
function limb(pts, color, w = 21) { line(pts, OUT, w + 9); line(pts, color, w); }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); return '#' + [16, 8, 0].map(s => Math.min(255, Math.round(((n >> s) & 255) * f)).toString(16).padStart(2, '0')).join(''); }
const P = (d) => new Path2D(d);

/* ---------- The art kit ----------
   Art files register named pieces; content files place them by name.
   PROP: a landmark at a position.  BACKDROP: the repeating world behind and in front.
   PANEL: one picture of a comic strip. */
const PROPS = {}, BACKDROPS = {}, PANEL_ART = {};
function PROP(name, draw) { PROPS[name] = draw; }
function BACKDROP(name, layers) { BACKDROPS[name] = layers; }
function PANEL(name, draw) { PANEL_ART[name] = draw; }
const CHAR = id => CONTENT.characters[id];



function guitarShape(lx, ly, ux, uy, nx, ny, col, sc = 1) {
  line([[ux, uy], [nx, ny]], OUT, 22 * sc); line([[ux, uy], [nx, ny]], '#5A3D27', 13 * sc);
  const ang = Math.atan2(ny - uy, nx - ux);
  c2.save(); c2.translate(nx, ny); c2.rotate(ang);
  for (const [px, py] of [[8, -14], [19, -14], [8, 14], [19, 14]]) circ(px * sc, py * sc, 4 * sc, '#E0A83A', 3);
  rrect(-2, -11 * sc, 30 * sc, 22 * sc, 5, '#3A2A1E', 4); c2.restore();
  ell(lx, ly, 44 * sc + 5, 38 * sc + 5, OUT, 0); ell(ux, uy, 31 * sc + 5, 27 * sc + 5, OUT, 0);
  ell(lx, ly, 44 * sc, 38 * sc, col, 0); ell(ux, uy, 31 * sc, 27 * sc, col, 0);
  ell(lx + 4 * sc, ly - 6 * sc, 30 * sc, 20 * sc, 'rgba(255,240,200,0.12)', 0);
  circ((lx + ux) / 2, (ly + uy) / 2, 9 * sc, '#2A1C14', 0);
}

/** Side-view character. (x, y) = point on the ground between the feet. facing: 1 = right, -1 = left. */
function person(col, x, y, o) {
  const s = CHAR_S * (o.scale || 1), st = o.stride || 0, ph = o.phase || 0, b = col.build;
  // Long evening shadow, always cast to the left (sun is on the right)
  c2.save(); c2.translate(x, y); c2.scale(s, s);
  ell(-60, 4, 120, 13, 'rgba(60,40,20,0.22)', 0);
  c2.scale(o.facing || 1, 1);
  c2.translate(0, -Math.abs(Math.sin(ph)) * 9 * st);
  const L = 54 * b.leg, S = 52 * b.leg, hipY = -(L + S) + 6;
  const sh = hipY - 128, hy = hipY - 216 * (b.head > 1 ? 1 : 1);
  const legPts = (off, base = 0) => {
    const a = Math.sin(ph + off) * .55 * st + base, k = Math.max(0, Math.cos(ph + off)) * .9 * st;
    const kx = Math.sin(a) * L, ky = hipY + Math.cos(a) * L;
    return [[0, hipY], [kx, ky], [kx + Math.sin(a - k) * S, ky + Math.cos(a - k) * S]];
  };
  const armPts = (off, base) => {
    const a = -Math.sin(ph + off) * .6 * st + base;
    const ex = Math.sin(a) * 46, ey = sh + 10 + Math.cos(a) * 46;
    return [[4, sh + 10], [ex, ey], [ex + Math.sin(a + .55) * 42, ey + Math.cos(a + .55) * 42]];
  };
  const drawLeg = (pts, dark) => { const c = dark ? shade(col.pants, .78) : col.pants; limb(pts, c, 22); const f = pts[2]; ell(f[0] + 12, f[1] + 2, 23, 11, col.shoes, 4); };
  const playing = o.pose === 'play';

  // Behind the body: guitar on the back (walking), far leg, far arm
  if (!playing && !o.noGuitar) guitarShape(-60, hipY - 52, -48, hipY - 100, -110, hy - 110, col.guitar, .95);
  drawLeg(legPts(Math.PI, .16 * (1 - st)), true);
  if (!playing) { const a = armPts(Math.PI, .1); limb(a, shade(col.coat, .8)); circ(a[2][0], a[2][1], 12, col.skin, 4); }
  else { limb([[4, sh + 10], [70, sh + 58], [132, sh + 66]], shade(col.coat, .8)); circ(134, sh + 66, 12, col.skin, 4); }

  // Coat
  const w = b.coat, hem = hipY + 14;
  fs(P(`M${-36 * w} ${sh - 10} Q4 ${sh - 22} ${42 * w} ${sh - 8} L${58 * w} ${hem} Q4 ${hem + 10} ${-54 * w} ${hem} Z`), col.coat);
  fs(P(`M${24 * w} ${sh - 12} L${46 * w} ${sh + 34} L${18 * w} ${sh + 14} Z`), shade(col.coat, .78), 3);
  if (col.wig) { for (let yy = sh + 22; yy < hem - 10; yy += 24) circ(36 * w, yy, 4, '#E0A83A', 2); }
  else { rrect(-48 * w, hipY - 36, 104 * w, 11, 0, shade(col.coat, .78), 3); rrect(26 * w, hipY - 39, 16, 17, 3, '#E0A83A', 3); }
  fs(P(`M${-30 * w} ${sh} Q${-36 * w} ${sh + 60} ${-46 * w} ${hem - 6}`), 'transparent', 0);
  line([[-28 * w, sh + 14], [-40 * w, hem - 12]], shade(col.coat, .85), 3);

  // Near leg

    rrect(x + w * .15, g - h * .62, w * .22, h * .62, 2, '#2B2018', 3);

  house(x, g, w, h, col, porch, lit) {
    rrect(x, g - h, w, h, 2, col, 4);
    poly([[x - 10, g - h + 2], [x + w / 2, g - h - 40], [x + w + 10, g - h + 2]], shade(col, .6), 4);
    for (let i = 0; i < 2; i++) { const wx = x + w * (.18 + i * .46); if (lit && brnd(x + i) > .3) glowRect(wx, g - h * .78, w * .2, h * .26, '#F2C46A'); else rrect(wx, g - h * .78, w * .2, h * .26, 1, '#2A2420', 3); }

  },

// p: { name, state: coming | cleared | crashed, since, live }

    mRect(x + w * .14, g - h + 12, w * .72, 32, on ? SOFT : DET); mText(sign, x + w / 2, g - h + 36, 20, on ? PAPER : MIDG);
  },
  lamp(x, g, h, col) { mRect(x - 2, g - h, PX, h, col); mRect(x - 10, g - h - 8, 20, 10, col); mRect(x - 6, g - h + 2, 12, 4, PAPER); },
  pole(x, g, h, col) { mRect(x - 2, g - h, PX, h, col); mRect(x - 24, g - h + 10, 48, PX, col); },
  cypress(x, g, h, col, moss) {
    // a trunk that flares at the water and tapers up into a flat, layered crown
    for (let y = 0; y < h * .86; y += PX) { const f = y / (h * .86), ww = 10 + 46 * Math.pow(1 - f, 3); mRect(x - ww / 2, g - y - PX, ww, PX, col); }
    const slabs = [[-84, 1, 168, 20], [-58, 1.07, 110, 16], [-122, .74, 74, 14], [36, .66, 66, 12]];
    mLine(x, g - h * .64, x - 86, g - h * .72, col, PX * 2); mLine(x, g - h * .56, x + 64, g - h * .64, col, PX * 2);
    for (const [ox, f, w, th] of slabs) { mRect(x + ox, g - h * f, w, th, col); if (moss) for (let i = 0; i < w / 18; i++) mRect(x + ox + 6 + i * 18, g - h * f + th, PX, 8 + ((i * 7 + ox) % 4) * 6, moss); }
  },
  cactus(x, g, h, col) { mRect(x - 8, g - h, 16, h, col); mRect(x - 30, g - h * .55, 22, 8, col); mRect(x - 30, g - h * .85, 8, h * .3, col); mRect(x + 8, g - h * .68, 20, 8, col); mRect(x + 22, g - h * .92, 8, h * .3, col); },
  mesa(x, g, w, h, col) { for (let i = 0; i < 4; i++) mRect(x + i * w * .04, g - h + i * 4, w - i * w * .08, h - i * 4, col); mRect(x + w * .1, g - h - 8, w * .8, 8, col); },
  windmill(x, g, h, col, t) {
    mLine(x - 22, g, x - 6, g - h, col); mLine(x + 22, g, x + 6, g - h, col);
    for (let i = 1; i < 4; i++) mLine(x - 22 + i * 5, g - i * h / 4, x + 22 - i * 5, g - i * h / 4, col);
    const a = t * 1.6; for (let b = 0; b < 4; b++) { const ab = a + b * Math.PI / 2; mLine(x, g - h, x + Math.cos(ab) * 46, g - h + Math.sin(ab) * 46, col, PX * 2); }
    mRect(x + 8, g - h - 6, 40, 12, col);   // the tail vane
  },
  stack(x, g, h, col, t, seed) {
    mRect(x - 12, g - h, 24, h, col);
    for (let i = 0; i < 5; i++) { const age = ((t * 18 + i * 34 + seed * 13) % 170) / 170; mDisc(x + age * 60, g - h - 14 - age * 150, 8 + age * 18, '#E6E6E6'); }
  },
  derrick(x, g, h, col) { mLine(x - 30, g, x, g - h, col); mLine(x + 30, g, x, g - h, col); for (let i = 1; i < 5; i++) { const y = g - i * h / 5, hw = 30 * (1 - i / 5); mLine(x - hw, y, x + hw, y, col); } mRect(x - 6, g - h - 10, 12, 10, col); },
  car(x, g, col) {
    mRect(x, g - 30, 120, 18, col); mRect(x + 24, g - 50, 64, 20, col); mRect(x + 32, g - 46, 22, 12, PAPER); mRect(x + 60, g - 46, 22, 12, PAPER);
    mDisc(x + 24, g - 10, 10, col); mDisc(x + 96, g - 10, 10, col); mRect(x + 22, g - 12, 4, 4, PAPER); mRect(x + 94, g - 12, 4, 4, PAPER);
  },
  bus(x, g, col) {
    mRect(x, g - 128, 210, 112, col);
    for (let i = 0; i < 6; i++) { mRect(x + 10 + i * 33, g - 118, 24, 24, PAPER); mRect(x + 10 + i * 33, g - 74, 24, 24, PAPER); }
    mRect(x, g - 86, 210, PX, PAPER); mDisc(x + 40, g - 12, 14, col); mDisc(x + 170, g - 12, 14, col); mRect(x + 38, g - 14, 4, 4, PAPER); mRect(x + 168, g - 14, 4, 4, PAPER);
  },
  phonebox(x, g, col) { mRect(x, g - 112, 44, 112, col); mRect(x + 4, g - 124, 36, 12, col); for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) mRect(x + 6 + c * 12, g - 98 + r * 18, 8, 12, PAPER); mRect(x + 8, g - 120, 28, 4, PAPER); },
  clocktower(x, g, h, col) {
    mRect(x - 28, g - h, 56, h, col); mRect(x - 36, g - h - 70, 72, 76, col); mDisc(x, g - h - 32, 24, PAPER); mRect(x - 2, g - h - 48, 4, 18, col); mRect(x, g - h - 34, 14, 4, col);
    mRoof(x, g - h - 150, g - h - 70, 76, col); mRect(x - 2, g - h - 170, 4, 20, col);
  },
  fountain(x, g, col, t) {
    mRect(x - 70, g - 26, 140, 26, col); mRect(x - 8, g - 70, 16, 44, col); mRect(x - 34, g - 74, 68, 8, col);
    for (let i = 0; i < 14; i++) { const ph = ((t * .9 + i / 14) % 1), side = i % 2 ? 1 : -1; mRect(x + side * ph * 56, g - 80 - Math.sin(ph * Math.PI) * 50, PX, PX, SOFT); }
  },
  watertower(x, g, col) { mLine(x - 30, g, x - 22, g - 120, col); mLine(x + 30, g, x + 22, g - 120, col); mLine(x - 26, g - 60, x + 26, g - 60, col); mRect(x - 40, g - 176, 80, 56, col); mRoof(x, g - 200, g - 176, 90, col); },
  bulbs(x, y, w, t, sag = 14) { for (let i = 0; i <= w; i += 24) { const yy = y + Math.sin(i / w * Math.PI) * sag; mRect(x + i, yy, PX * 2, PX * 2, Math.floor(t * 2 + i / 24) % 2 ? SOFT : DET); } },
  fence(x, g, w, col) { mRect(x, g - 30, w, PX, col); for (let i = 0; i <= w; i += 20) mRect(x + i, g - 40, PX * 2, 40, col); },
  chair(x, g, col) { mRect(x, g - 44, PX, 44, col); mRect(x, g - 22, 26, PX, col); mRect(x + 22, g - 22, PX, 22, col); mRect(x - 6, g - 2, 40, PX, col); },
  sign(x, g, col, a, b) { mRect(x - 3, g - 160, 6, 160, col); mRect(x - 74, g - 150, 148, 24, col); mText(a, x, g - 132, 16, PAPER); mRect(x - 74, g - 118, 148, 24, col); mText(b, x, g - 100, 16, PAPER); },
};

// ---------- the twelve places ----------
// Each: far(k, x, g, t) and mid(k, x, g, t) layers on 600-wide tiles, a sky ('moon', 'sun' or 'stars'),
// and optional water, or an overlay drawn over the mid layer.
const MSC = {
  woods: { sky: 'moon',   // hill country: pine woods and a juke joint with lights strung out front
    far: (k, x, g) => { mRect(x, g - 40, 600, 40, FAR); for (let i = 0; i < 4; i++) M.pine(x + i * 150 + brnd(k, i) * 60, g - 30, 150 + brnd(k, i + 9) * 100, FAR); },
    mid: (k, x, g, t) => { if (k % 3 === 0) { M.house(x + 160, g, 200, 110, MIDG, DET, k, true); M.bulbs(x + 120, g - 172, 280, t); mText('JUKE', x + 260, g - 128, 18, PAPER); }
      else { M.pine(x + 110, g, 210, MIDG); M.pine(x + 420, g, 170, MIDG); if (k % 3 === 1) M.fence(x + 200, g, 160, DET); } } },
  fields: { sky: 'sun',   // the Delta: flat cotton fields, a water tower, the crossroads
    far: (k, x, g) => { for (let i = 0; i < 12; i++) mRect(x + i * 50, g - 18 - brnd(k, i) * 22, 50, 40, FAR); if (k % 4 === 1) M.watertower(x + 300, g - 10, FAR); },
    mid: (k, x, g) => { for (let j = 0; j < 15; j++) { mRect(x + j * 40 + 4, g - 14, PX, 14, DET); mRect(x + j * 40, g - 22, 12, 8, MIDG); }
      if (k % 3 === 0) M.sign(x + 300, g, SOFT, 'HWY 61', 'HWY 49'); else if (k % 3 === 2) M.house(x + 260, g, 110, 90, MIDG, DET, k, false); } },

    mid: (k, x, g) => { M.house(x + 70, g, 150, 130, MIDG, DET, k, true); M.chair(x + 90, g, SOFT); M.fence(x + 250, g, 80, DET); M.house(x + 360, g, 140, 116, MIDG, DET, k + 5, true); } },
  beale: { sky: 'moon',   // Beale Street: storefronts and signs, towers behind
    far: (k, x, g) => { for (let i = 0; i < 5; i++) M.tower(x + i * 120 + 10, g - 20, 80 + brnd(k, i) * 30, 150 + brnd(k, i + 3) * 120, FAR, k * 7 + i, .45); },

      for (let j = 0; j < 5; j++) mRect(x + 40 + j * 9, g - 20 - (j % 2) * 10, PX, 20 + (j % 2) * 10, DET); },
    over: (cam, t) => { for (let i = 0; i < 14; i++) if (Math.sin(t * 2.3 + i * 1.9) > .2) mRect((brnd(i) * VW + Math.sin(t * .5 + i) * 30 + VW) % VW, 220 + brnd(i, 7) * 200, PX, PX, SOFT); } },

    far: (k, x, g) => { for (let i = 0; i < 4; i++) { const h = 110 + brnd(k, i) * 80; mRect(x + i * 150, g - h, 140, h, FAR); if (brnd(k, i + 2) > .5) M.watertower(x + i * 150 + 70, g - h, FAR); } },
    mid: (k, x, g, t) => { if (k % 2 === 0) { M.tower(x + 120, g, 300, 200, MIDG, k, .35); mRect(x + 150, g - 120, 240, 40, SOFT); mText('TONIGHT', x + 270, g - 92, 22, PAPER); M.bulbs(x + 150, g - 128, 240, t, 0); M.bulbs(x + 150, g - 76, 240, t + .5, 0);
        mRect(x + 236, g - 290, 68, 90, SOFT); mText('CLUB', x + 270, g - 236, 18, blink(t, k) ? PAPER : DET); }
      else { M.car(x + 120, g, SOFT); M.lamp(x + 330, g, 150, SOFT); M.tower(x + 400, g, 160, 170, MIDG, k + 9, .3); } } },
  detroit: { sky: 'sun',  // Detroit: the plant's sawtooth roof and smokestacks, rowhouses
    far: (k, x, g, t) => { mRect(x, g - 80, 600, 80, FAR); for (let i = 0; i < 10; i++) mRoof(x + i * 60 + 30, g - 110, g - 80, 60, FAR); M.stack(x + 140, g - 80, 150, FAR, t, k); M.stack(x + 420, g - 80, 120, FAR, t, k + 3); },
    mid: (k, x, g) => { M.tower(x + 40, g, 140, 150, MIDG, k, .5); M.tower(x + 200, g, 130, 130, MIDG, k + 2, .5); M.pole(x + 380, g, 190, SOFT); mRect(x + 356, g - 180, 600, 2, SOFT); M.tower(x + 430, g, 140, 160, MIDG, k + 4, .5); } },
  chicago: { sky: 'sun',  // the South Side: the elevated train over the street, the skyline beyond
    far: (k, x, g) => { for (let i = 0; i < 4; i++) { const h = 220 + brnd(k, i) * 140, w = 90 + brnd(k, i + 5) * 40; M.tower(x + i * 150, g - 10, w, h, FAR, k * 5 + i, .4); if (brnd(k, i + 8) > .6) mRect(x + i * 150 + w / 2 - 2, g - 10 - h - 50, PX, 50, FAR); } },
    mid: (k, x, g) => { for (let i = 0; i < 3; i++) M.storefront(x + i * 200, g, 190, 120, MIDG, ['RECORDS', 'BAR', 'LIQUOR'][(k + i + 300) % 3], true); },

      tiles(cam, .6, 150, (k, x) => { mRect(x + 70, deck, 12, 220, SOFT); mLine(x + 76, deck + 10, x + 150, deck + 80, DET); mLine(x + 76, deck + 80, x + 150, deck + 10, DET); });
      mRect(0, deck - 16, VW, 18, SOFT); for (let i = 0; i < VW; i += 24) mRect(i, deck - 22, 8, 6, SOFT);
      const tx = ((t * 240 - cam * .6) % 3600 + 3600) % 3600 - 900;
      for (let c = 0; c < 4; c++) { const cx = tx + c * 172; mRect(cx, deck - 76, 164, 56, SOFT); for (let w = 0; w < 5; w++) mRect(cx + 12 + w * 30, deck - 66, 18, 18, PAPER); } } },
  westside: { sky: 'stars',  // the West Side: brick tenements, fire escapes, a club sign down the wall

      if (k % 2 === 0) { mRect(x + 270, g - 250, 36, 170, SOFT); 'BLUES'.split('').forEach((ch, i) => mText(ch, x + 288, g - 222 + i * 32, 22, blink(t, k + i, 2) ? PAPER : DET)); } } },
  texas: { sky: 'sun',   // Texas: mesas, a windmill, cactus, a roadhouse

      else if (k % 3 === 1) { M.windmill(x + 200, g, 200, SOFT, t); M.cactus(x + 440, g, 90, MIDG); } else { M.cactus(x + 120, g, 110, MIDG); M.cactus(x + 380, g, 80, MIDG); } } },

    mid: (k, x, g, t) => { if (k % 2 === 0) { mRect(x + 120, g - 190, 320, 190, MIDG); for (let c = 0; c < 6; c++) mRect(x + 140 + c * 54, g - 110, 10, 110, PAPER); mRect(x + 150, g - 176, 260, 44, SOFT); mText('BALLROOM', x + 280, g - 146, 22, PAPER); M.bulbs(x + 150, g - 184, 260, t, 0); }
      else { M.fountain(x + 260, g, MIDG, t); M.lamp(x + 120, g, 150, SOFT); M.lamp(x + 400, g, 150, SOFT); } } },
  london: { sky: 'none', // London: terraces with chimney pots, a phone box, a bus, the clock tower beyond
    far: (k, x, g) => { for (let i = 0; i < 6; i++) { mRect(x + i * 100, g - 130, 96, 130, FAR); mRect(x + i * 100 + 20, g - 150, 12, 20, FAR); mRect(x + i * 100 + 60, g - 146, 12, 16, FAR); } if (k % 3 === 0) M.clocktower(x + 300, g, 200, FAR); },

function minScene(sc, road) {
  return {
    back(cam, t) {
      c2.fillStyle = PAPER; c2.fillRect(0, 0, VW, VH);
      if (sc.sky === 'moon') { mDisc(VW * .78, 110, 30, '#E4E4E4'); }
      if (sc.sky === 'sun') { mDisc(VW * .72, 150, 46, '#E9E9E9'); }
      if (sc.sky === 'stars') { for (let i = 0; i < 26; i++) mRect(brnd(i, 1) * VW, 30 + brnd(i, 2) * 200, PX, PX, Math.sin(t * 1.5 + i) > .6 ? DET : FAR); mDisc(VW * .8, 100, 22, '#E4E4E4'); mDisc(VW * .8 + 12, 94, 20, PAPER); }
      for (let i = 0; i < 4; i++) { const cx = ((i * 310 - cam * .12 - t * 6) % (VW + 200) + VW + 200) % (VW + 200) - 100; sprite(SPRITES.cloud, cx, 70 + (i % 3) * 46, '#DCDCDC', 3); }
      tiles(cam, .25, 600, (k, x) => sc.far(k, x, GROUND_Y - 4, t));
      tiles(cam, .6, 600, (k, x) => sc.mid(k, x, GROUND_Y - 4, t));
      if (sc.over) sc.over(cam, t);
      // the ground: one line, and pebbles (or water) below it
      c2.fillStyle = PAPER; c2.fillRect(0, GROUND_Y - 2, VW, VH);
      c2.fillStyle = INK; c2.fillRect(0, GROUND_Y - 4, VW, 2);
      if (sc.water) tiles(cam, 1, 120, (k, x) => { mRect(x + brnd(k) * 60, GROUND_Y + 10 + brnd(k, 2) * 30, 28, PX, DET); mRect(x + 60 + brnd(k, 4) * 40, GROUND_Y + 30 + brnd(k, 5) * 16, 16, PX, MIDG); });
      else for (let k = 0; k < 40; k++) { const px = ((k * 97 - cam) % VW + VW) % VW; c2.fillStyle = INK; c2.fillRect(Math.round(px / 2) * 2, GROUND_Y + 6 + (k * 13) % 26, 2 + (k % 3) * 2, 2); }
      if (road) tiles(cam, 1, 96, (k, x) => mRect(x, GROUND_Y + 22, 40, PX, MIDG));
    },
  };
}

const HERO_SCALE = 1.5;                                       // screen pixels per art pixel (1.5 makes him about 125 px tall)
const HERO_COL = { '#': '#2E2E2E', '+': '#C8C8C8', 'o': '#FFFFFF' };
const heroCanvas = {};
function heroFrame(name) {
  if (heroCanvas[name]) return heroCanvas[name];
  const f = HERO[name], h = f.rows.length, w = f.rows[0].length, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  f.rows.forEach((r, j) => { for (let i = 0; i < w; i++) { const c = HERO_COL[r[i]]; if (c) { g.fillStyle = c; g.fillRect(i, j, 1, 1); } } });
  return (heroCanvas[name] = cv);
}
// Draw a frame with its head at x and its bottom row at `bottom`; mirrored when walking left.
function drawHero(name, x, bottom, flip = false, s = HERO_SCALE) {
  const f = HERO[name], cv = heroFrame(name);
  c2.save(); c2.imageSmoothingEnabled = false; c2.translate(Math.round(x), Math.round(bottom - cv.height * s));
  if (flip) c2.scale(-1, 1);
  c2.drawImage(cv, -f.ax * s, 0, cv.width * s, cv.height * s); c2.restore();
}

// ---------- the walker, the signpost ----------
function minPerson(x, y, o) {
  // One full cycle (two steps) carries him about 63 px (4 × half-stride 10.5 × scale 1.5), so the planted foot stays put at any speed.
  const air = y < GROUND_Y - 2, step = ((Math.floor(o.phase * 2.31) % 8) + 8) % 8;
  drawHero(air ? 'jump' : o.stride > .1 ? 'step' + step : 'stand', x, y - 3, o.facing < 0);
}
function minSignpost(x, t, p) {
  if (typeof t === 'object') p = t;   // (called with or without the time)
  if (x < -200 || x > VW + 200) return;
  const g = GROUND_Y - 4;
  const label = (p.text || 'on the road →').toUpperCase(); c2.font = `bold 16px ${MONO}`;
  const w = Math.max(150, Math.ceil(c2.measureText(label).width) + 28);   // the board fits its words
  mRect(x - 4, g - 150, 8, 150, INK); mRect(x - 12, g - 156, w, 36, INK);
  for (let i = 0; i < 5; i++) mRect(x - 12 + w + i * 4, g - 154 + i * 4, PX, 36 - i * 8, INK);   // the arrow point
  mText(label, x - 12 + w / 2, g - 132, 16, PAPER);
}

  const g = cv.getContext('2d'), col = { '#': '#2E2E2E', '+': '#C8C8C8', 'o': '#FFFFFF' };

/* =====================================================================
   11. RACE MODE
   Play anything in the key to row at a steady pace. At every chord change a big
   letter floats into your path: play that chord's root as it reaches you to leap
   over it. Miss it, or spray notes at it, and you crash and lose ground.
   ===================================================================== */
const CRUISE = 210;                 // speed while you're playing in key
// The jump window around a chord change (seconds before, after), per difficulty.
const WINDOWS = { wide: [.6, .35], normal: [.45, .25], tight: [.3, .15] };
const winEarly = () => WINDOWS[LOC.letters.window][0], winLate = () => WINDOWS[LOC.letters.window][1];
/* Timing. You play along to the music you HEAR, which reaches your ears a little after it's scheduled
   (headphone delay, worse over Bluetooth); then your note takes a moment to reach the mic and be
   recognised. Both delays are allowed for: measured by the Timing check if you've done it, otherwise
   estimated from what the browser reports. */
const TIMING_KEY = 'fret-detective-timing';
let TIMING = (() => { try { return JSON.parse(localStorage.getItem(TIMING_KEY)); } catch { return null; } })();
const outLat = () => ctx ? (ctx.outputLatency || 0) + (ctx.baseLatency || 0) : 0;   // how late you hear the music
const noteLag = () => TIMING ? TIMING.lag : .14 + outLat();                         // how late a played note is recognised, relative to the beat
const GATE_LEAD = 70, GATE_SPEED = 300; // letters reach the boat exactly on the change, whatever your speed
const RACE = {
  phase: 'intro',      // intro | countdown | racing | won | lost
  x: 0, v: 0, rx: 0, rv: 0, stroke: 0, rstroke: 0,
  gates: [], cleared: 0, total: 0,
  goAt: 0, endAt: 0, lurchAt: -9, lastKeyAt: -9, jumpAt: -9, crashAt: -9, rCrashAt: -9,
};

// Where we are in the backing: the current beat, how far through it, and when any beat starts.
function beatClock() {
  if (!backing.on || !ctx) return null;
  const beat = 60 / BACKING_BPM;
  const cur = backing.beat - Math.ceil((backing.next - ctx.currentTime) / beat);
  const start = backing.next - (backing.beat - cur) * beat;
  return { cur, beat, start, frac: Math.min(.999, Math.max(0, (ctx.currentTime - start) / beat)), at: i => start + (i - cur) * beat };
}
const groundAt = i => GROUND[((i % GROUND.length) + GROUND.length) % GROUND.length];
const chordName = i => { const [root, q] = groundAt(i); return NAMES[pc(root)] + CHORD_SUFFIX[q]; };
const BPC = () => LOC.backing.beats_per_chord || 1;

function beginRace() {
  Object.assign(RACE, { phase: 'intro', x: 0, v: 0, rx: LOC.rival ? LOC.rival.head_start : -1e9, rv: 0, gates: [], cleared: 0, total: 0 });
  G.state = 'race'; G.cam = 0; G.recent = []; render();
}
function startCountdown() {
  if (RACE.phase !== 'intro' && RACE.phase !== 'lost' && !(RACE.phase === 'won' && G.practice)) return;
  Object.assign(RACE, { phase: 'countdown', goAt: performance.now() / 1000 + 3, x: 0, v: 0, rx: LOC.rival ? LOC.rival.head_start : -1e9, rv: 0, gates: [], cleared: 0, total: 0,
    lurchAt: -9, jumpAt: -9, crashAt: -9, rCrashAt: -9, firstBeat: null });
  stopBacking(); G.recent = []; render();
}

// Keep the next couple of chord changes queued as letters on the water.
function queueGates(clk) {
  if (RACE.firstBeat === null) RACE.firstBeat = clk.cur;
  const bpc = BPC();
  let b = clk.cur - (((clk.cur % bpc) + bpc) % bpc) + bpc; // the next change
  for (let k = 0; k < 2; k++, b += bpc) {
    if (b <= RACE.firstBeat) continue;                      // you start on the first chord: no letter for it
    if (Math.round(b / bpc) % LOC.letters.every) continue;   // easier races skip some changes (b is always on a bar line)
    if (LOC.letters.targets === 'home') {   // only when the music comes home (every other bar if there's only one chord)
      const home = LOC.key.root, oneChord = new Set(GROUND.map(g => pc(g[0]))).size === 1;
      if (pc(groundAt(b)[0]) !== home) continue;
      if (oneChord ? Math.round(b / bpc) % 2 : pc(groundAt(b - bpc)[0]) === home) continue;
    }
    if (!RACE.gates.some(g => g.beat === b)) {
      const [root] = groundAt(b), rpc = pc(root);
      // Only ask for notes you've been taught. If you know more than one place for this note,
      // the letter's height says which: low on the water for the lower one, up on a post for the higher.
      const known = loadKnown(), useKnown = LOC.letters.roots === 'known' && known.length;
      const places = useKnown ? known.filter(k => pc(k.midi) === rpc).sort((a, b) => a.midi - b.midi) : [];
      if (useKnown && !places.length) continue;
      const pick = places.length ? places[Math.round(b / bpc) % places.length] : null;
      const level = !pick || places.length < 2 ? 0 : places.indexOf(pick) / (places.length - 1);
      RACE.gates.push({ beat: b, root: rpc, name: chordName(b), state: 'coming', wrong: 0, at: -9,
        midi: pick ? pick.midi : null, exact: places.length > 1, where: pick, level });
    }
  }
  for (const g of RACE.gates) g.T = clk.at(g.beat);
  RACE.gates = RACE.gates.filter(g => ctx.currentTime - g.T < 3);
}
function resolveGate(g, ok) {
  g.state = ok ? 'cleared' : 'crashed'; g.at = performance.now() / 1000; RACE.total++;
  if (ok) { RACE.cleared++; RACE.jumpAt = g.at; RACE.v = Math.max(RACE.v, CRUISE) + 70; }
  else { RACE.crashAt = g.at; RACE.v = 25; }
}

function raceNote(note, t) {
  if (RACE.phase === 'intro' || ((RACE.phase === 'lost' || (RACE.phase === 'won' && G.practice)) && t - RACE.endAt > 1.5)) { startCountdown(); return; } // play anything to (re)start
  if (RACE.phase !== 'racing') return;
  const p = pc(note.midi), ok = KEY.has(p), nt = ctx.currentTime - noteLag(); HEALTH.raceNoteAt = performance.now() / 1000;
  const g = RACE.gates.find(g => g.state === 'coming' && nt >= g.T - winEarly() && nt <= g.T + winLate());
  G.recent.push({ name: note.name, ok, sweet: !!g && p === g.root }); if (G.recent.length > 6) G.recent.shift();
  if (ok) RACE.lastKeyAt = t; else { RACE.lurchAt = t; RACE.v *= .8; }
  if (!g) return;
  if (g.exact ? Math.round(note.midi) === g.midi : p === g.root) resolveGate(g, true); // one place known: any octave; more: the right height
  else if (++g.wrong >= 3) resolveGate(g, false); // spraying every note at it doesn't count: choose the root
}

function raceUpdate(dt, t) {
  if (RACE.phase === 'countdown' && t >= RACE.goAt) { RACE.phase = 'racing'; startBacking(); render(); }
  const clk = beatClock();
  if (RACE.phase === 'racing' && clk) {
    queueGates(clk);
    for (const g of RACE.gates) if (g.state === 'coming' && ctx.currentTime - noteLag() > g.T + winLate()) {   // wait for a note that might still be on its way
      resolveGate(g, false);                                           // missed it
      if (LOC.rival && Math.random() < LOC.rival.miss) { RACE.rCrashAt = t; RACE.rv = 25; } // the courier hits some too
    }
    const playing = LOC.rowing === 'auto' || t - RACE.lastKeyAt < 1.2 || G.holdWalk; // easy races row for you
    if (!mic && G.holdWalk) for (const g of RACE.gates) if (g.state === 'coming' && Math.abs(ctx.currentTime - g.T) < .1) resolveGate(g, true); // no mic: holding plays well
    let target = playing ? CRUISE : 35;
    if (t - RACE.crashAt < .9) target = Math.min(target, 80);           // shaken after a crash
    RACE.v += (target - RACE.v) * Math.min(1, dt * 1.6);
    // The courier: a steady pace with a little wobble, easing off if far ahead and pushing if far behind.
    const gap = RACE.rx - RACE.x;
    let rt = LOC.rival ? CRUISE * LOC.rival.pace * (1 + .05 * Math.sin(t * .6)) : 0;
    if (gap > 600) rt *= .88; else if (gap < -350) rt *= 1.08;
    if (t - RACE.rCrashAt < .9) rt = Math.min(rt, 80);
    RACE.rv += (rt - RACE.rv) * Math.min(1, dt * 1.2);
  } else { RACE.v *= .97; RACE.rv *= .97; }
  RACE.x += RACE.v * dt; RACE.rx += RACE.rv * dt;
  RACE.stroke += RACE.v * dt * .05; RACE.rstroke += RACE.rv * dt * .05;
  if (RACE.phase === 'racing' && (RACE.x >= LOC.length || (LOC.rival && RACE.rx >= LOC.length))) finishRace(RACE.x >= LOC.length);
}
async function finishRace(won) {
  RACE.phase = won ? 'won' : 'lost'; RACE.endAt = performance.now() / 1000;
  RACE.pct = RACE.total ? Math.round(100 * RACE.cleared / RACE.total) : 0;
  RACE.secs = RACE.endAt - RACE.goAt;
  RACE.newBest = won ? markCleared(LOC.id, { pct: RACE.pct, cleared: RACE.cleared, total: RACE.total, secs: RACE.secs }) : false;
  if (!LOC.rival) {
    RACE.passed = !RACE.total || RACE.cleared / RACE.total >= LOC.pass;
    if (RACE.passed) chime();
    if (!G.practice) { const id = LOC.id; setTimeout(() => { if (G.state === 'race' && LOC.id === id) RACE.passed ? enterLocation(LOC.next, { x: LOC.return_x, arrived: true }) : rideBack(); }, RACE.passed ? 2600 : 3400); }
  }
  else if (won && G.practice) { chime(); }
  else if (won) {
    chime(); G.solved.add(LOC.id);
    const page = { id: Date.now(), eid: LOC.id, kind: 'race', case: LOC.case, place: LOC.name, from: LOC.rival.name, clue: LOC.win.clue,
      motif: 'The race', notes: [], playedNotes: [], tab: '', score: RACE.pct, cleared: RACE.cleared, total: RACE.total, take: null, date: new Date().toLocaleString() };
    const pages = loadNotebook().filter(p => (p.eid || p.case) !== LOC.id || p.score > page.score);
    if (!pages.some(p => (p.eid || p.case) === LOC.id)) pages.push(page);
    saveNotebook(pages); renderNotebook();
  }
  setTimeout(() => { stopBacking(); render(); }, won ? 1600 : 1200);
}
// Didn't make it: back to the place you rode out of, just left of its signpost.
function rideBack() {
  const from = Object.values(CONTENT.locations).find(l => (l.exits || []).some(e => e.to === LOC.id));
  if (!from) { enterLocation(LOC.next, { x: LOC.return_x, arrived: true }); return; }
  const ex = from.exits.find(e => e.to === LOC.id);
  enterLocation(from.id, { x: Math.max(from.start_x, ex.x - 380) });
  toast('Stop by the sign when you’re ready to ride again.');
}
function leaveRace() { if (G.practice) backToMenu(); else enterLocation(LOC.next, { x: LOC.return_x, arrived: true }); }

function raceFrame(dt, t) {
  raceUpdate(dt, t);
  G.cam += (RACE.x - 300 - G.cam) * Math.min(1, dt * 4);
  const cam = G.cam;
  drawWorld(cam, t);
  if (LOC.look === 'minimal') { minRide(cam, t); return; }
  // letters on the water, arriving at the boat exactly on each chord change
  const boatX = RACE.x - cam;
  for (const g of RACE.gates) {
    if (g.T === undefined) continue;
    const x = boatX + GATE_LEAD + (g.T + outLat() - ctx.currentTime) * GATE_SPEED;   // arrives when you HEAR the change
    const live = g.state === 'coming' && g.T + outLat() - ctx.currentTime <= winEarly();
    PROPS[LOC.obstacles === 'turtles' ? 'turtle' : 'chord-gate'](x, t, { name: g.name, root: NAMES[g.root], state: g.state, since: t - g.at, live, level: g.level });
  }
  if (LOC.rival) PROPS['rowing-boat'](RACE.rx - cam + 40, t, { rider: LOC.rival.character, rower: LOC.rival.rower, stroke: RACE.rstroke, scale: .82, y: 420, seed: 2, noGuitar: true,
    shake: t - RACE.rCrashAt < .5 ? 6 : 0 });
  const js = t - RACE.jumpAt, cs = t - RACE.crashAt;
  if (LOC.vehicle === 'bicycle') PROPS['bicycle'](boatX, t, { rider: LOC.player, pedal: RACE.stroke, y: GROUND_Y - (js < .6 ? Math.sin(js / .6 * Math.PI) * 90 : 0), tumble: cs < .9 ? cs : null });
  else PROPS['rowing-boat'](boatX, t, { rider: LOC.player, rower: LOC.rower, stroke: RACE.stroke, playing: RACE.phase === 'racing',
    y: 470 - (js < .6 ? Math.sin(js / .6 * Math.PI) * 70 : 0), shake: cs < .5 ? 8 * (1 - cs / .5) : 0, splash: cs < .7 ? cs : null });
  const B = BACKDROPS[LOC.backdrop];
  if (B.front) B.front(cam, t);
  if (B.atmosphere) B.atmosphere(dt);
  raceHud(t);
}

function raceHud(t) {
  // the course: you, the courier, the finish
  const x0 = 210, x1 = VW - 210, y = 30;
  rrect(x0 - 24, y - 16, x1 - x0 + 48, 32, 10, 'rgba(30,23,18,.72)', 0);
  c2.fillStyle = 'rgba(240,223,184,.35)'; c2.fillRect(x0, y - 1, x1 - x0, 2);
  c2.fillStyle = '#F0DFB8'; c2.font = '16px Georgia, serif'; c2.textAlign = 'center'; c2.fillText('⚑', x1 + 4, y + 6);
  const at = d => x0 + (x1 - x0) * Math.min(1, Math.max(0, d / LOC.length));
  if (LOC.rival) { c2.fillStyle = '#3E6A3E'; c2.beginPath(); c2.arc(at(RACE.rx), y, 8, 0, 7); c2.fill(); }
  c2.fillStyle = '#F2C14E'; c2.beginPath(); c2.arc(at(RACE.x), y, 8, 0, 7); c2.fill();
  c2.textAlign = 'left';
  if (RACE.phase === 'racing') {

    rrect(VW / 2 - 130, 58, 260, 66, 12, 'rgba(16,14,24,.6)', 0);
    c2.textAlign = 'center';
    if (g) {
      const left = g.T + outLat() - ctx.currentTime, beat = 60 / BACKING_BPM, now = left <= winEarly();
      c2.fillStyle = now ? '#FFE08A' : '#F0DFB8'; c2.font = '600 26px Georgia, serif';
      c2.fillText(now ? `play ${NAMES[g.root]} now!` : `next: play ${NAMES[g.root]}`, VW / 2, 88);
      if (g.where) { c2.font = '14px Georgia, serif'; c2.fillStyle = 'rgba(240,223,184,.75)'; c2.fillText(`${ORDINAL[g.where.string]} string, ${g.where.fret ? 'fret ' + g.where.fret : 'open'}`, VW / 2, 104); }
      const beats = Math.max(0, Math.ceil(left / beat)), n = Math.min(8, Math.max(BPC(), beats));
      for (let i = 0; i < n; i++) { c2.fillStyle = i < beats ? 'rgba(240,223,184,.85)' : 'rgba(240,223,184,.2)'; c2.beginPath(); c2.arc(VW / 2 - (n - 1) * 9 + i * 18, 116, 4, 0, 7); c2.fill(); }
    }
    c2.textAlign = 'left';

    c2.font = 'bold 16px Georgia, serif'; let x = 30;
    for (const n of G.recent) { c2.fillStyle = n.sweet ? '#FFE08A' : n.ok ? '#C79A55' : '#C0605A'; c2.fillText(n.name, x, 84); x += c2.measureText(n.name).width + 12; }
    c2.fillStyle = '#F1E9DC'; c2.font = '15px Georgia, serif'; c2.fillText(`jumps ${RACE.cleared} of ${RACE.total}`, 30, 112);
    if (t - RACE.lurchAt < .6) { c2.fillStyle = `rgba(192,96,90,${1 - (t - RACE.lurchAt) / .6})`; c2.font = 'bold 18px Georgia, serif'; c2.fillText('lurch!', 160, 112); }
    if (t - RACE.crashAt < .9) { c2.save(); c2.textAlign = 'center'; c2.globalAlpha = 1 - (t - RACE.crashAt) / .9; c2.font = 'bold 54px Georgia, serif'; c2.fillStyle = '#E8A090'; c2.fillText('crash!', VW / 2, VH / 2 - 40); c2.restore(); }
  }
  if (RACE.phase === 'countdown') {
    const n = Math.ceil(RACE.goAt - t);
    c2.save(); c2.textAlign = 'center'; c2.font = 'bold 120px Georgia, serif'; c2.fillStyle = 'rgba(240,223,184,.9)';
    c2.fillText(n > 0 ? String(n) : '', VW / 2, VH / 2 + 60); c2.restore();
  }
  if (RACE.phase === 'racing' && performance.now() / 1000 - RACE.goAt < 1) {
    c2.save(); c2.textAlign = 'center'; c2.font = 'bold 90px Georgia, serif'; c2.fillStyle = 'rgba(240,223,184,.9)'; c2.fillText('Row!', VW / 2, VH / 2 + 50); c2.restore();
  }
  if (RACE.phase === 'won' || RACE.phase === 'lost') {
    c2.save(); c2.textAlign = 'center'; c2.font = 'bold 64px Georgia, serif'; c2.fillStyle = 'rgba(240,223,184,.92)';
    c2.fillText(!LOC.rival ? (RACE.passed ? 'Made it!' : 'Not quite…') : RACE.phase === 'won' ? 'Caught him!' : 'He got away…', VW / 2, VH / 2 - 20); c2.restore();
  }
}

/* =====================================================================
   12. THE MAP AND THE TUNER
   ===================================================================== */

/* ---------- What you've discovered ---------- */
const DISC_KEY = 'fret-detective-discovered';
function loadDiscovered() { try { return JSON.parse(localStorage.getItem(DISC_KEY)) || { places: [], zones: {} }; } catch { return { places: [], zones: {} }; } }
function discover(id, zone) {
  const d = loadDiscovered();
  let changed = false;
  if (!d.places.includes(id)) { d.places.push(id); changed = true; }
  if (zone) { const z = d.zones[id] ||= []; if (!z.includes(zone)) { z.push(zone); changed = true; } }
  if (!changed) return;
  try { localStorage.setItem(DISC_KEY, JSON.stringify(d)); } catch {}
  if (!mapEl.hidden) renderMap();
}

/* ---------- The map ---------- */
const mapEl = document.getElementById('map');
let mapWorld = null;
// Where each place leads: a lesson or race's "next", and a case's exits.
// (open = only routes you can take right now: exits whose requirements you've met)
function linksFrom(l, open = false) { return [l.next, ...(l.exits || []).filter(e => !open || e.requires.every(r => G.solved.has(r))).map(e => e.to)].filter(Boolean); }
function renderMap() {
  const d = loadDiscovered(), locs = CONTENT.locations;
  const worlds = [...new Set(d.places.map(id => locs[id]?.world).filter(Boolean))];
  if (!worlds.length) { mapEl.innerHTML = `<h2>Map</h2><p class="muted">Nowhere yet. Start walking and the places you find will appear here.</p>`; return; }
  if (!worlds.includes(mapWorld)) mapWorld = (LOC && worlds.includes(LOC.world)) ? LOC.world : worlds[worlds.length - 1];
  const page = CONTENT.game.maps?.[mapWorld] || { title: mapWorld, landmarks: [] };
  const here = LOC && G.state !== 'title' ? LOC.id : null;
  const W = 640, H = 400, px = p => 40 + p.x * (W - 80), py = p => 40 + p.y * (H - 80);
  const inWorld = Object.values(locs).filter(l => l.world === mapWorld && !l.interior);
  const known = inWorld.filter(l => d.places.includes(l.id));
  // places you haven't been, but can see a way to from somewhere you have
  const hinted = inWorld.filter(l => !d.places.includes(l.id) && known.some(k => linksFrom(k, true).includes(l.id)));
  const lines = [];
  for (const a of known) for (const to of linksFrom(a)) {
    const b = locs[to]; if (!b || b.world !== mapWorld || !(known.includes(b) || hinted.includes(b))) continue;
    lines.push(`<path d="M${px(a.map)} ${py(a.map)} Q${(px(a.map) + px(b.map)) / 2} ${(py(a.map) + py(b.map)) / 2 - 40} ${px(b.map)} ${py(b.map)}" fill="none" stroke="#9C7A4E" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="${known.includes(b) ? .9 : .45}"/>`);
  }
  const elsewhere = known.flatMap(a => linksFrom(a).filter(to => locs[to] && locs[to].world !== mapWorld && d.places.includes(to)).map(to => locs[to]));
  const pin = l => {
    const x = px(l.map), y = py(l.map), zones = (d.zones[l.id] || []);
    return `<g>${l.id === here ? `<circle class="here-ring" cx="${x}" cy="${y}" r="30" fill="none" stroke="#C0603A" stroke-width="3"/>` : ''}
      <circle cx="${x}" cy="${y}" r="27" fill="#FFF8E8" stroke="#6B4E2E" stroke-width="3"/>
      <text x="${x}" y="${y + 10}" text-anchor="middle" font-size="27">${l.map.icon}</text>
      <text x="${x}" y="${y + 50}" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3A2A1A">${esc(l.name)}</text>
      ${zones.map((z, i) => `<text x="${x}" y="${y + 70 + i * 17}" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#6B5640">${esc(z)}</text>`).join('')}
      ${l.id === here ? `<text x="${x}" y="${y - 38}" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#A04A2A">you are here</text>` : ''}</g>`;
  };
  const mystery = l => { const x = px(l.map), y = py(l.map);
    return `<g opacity=".65"><circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#8A6E4A" stroke-width="2.5" stroke-dasharray="5 5"/><text x="${x}" y="${y + 9}" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8A6E4A">?</text></g>`; };

/* ---------- The tuner ----------

const tunerEl = document.getElementById('tuner');
const STRINGS = [[40, '6th', 'E'], [45, '5th', 'A'], [50, '4th', 'D'], [55, '3rd', 'G'], [59, '2nd', 'B'], [64, '1st', 'E']];

async function openTuner() {

  G.vx = 0; G.lastNote = -9;

    <div class="tuner-wrap">

      <h2 style="margin-top:14px">Microphone</h2>

      <div class="live" id="timingCheck">${TIMING ? `Measured: the game hears you ${Math.round(TIMING.lag * 1000)} ms after the beat. Rides allow for it.` : 'Not measured yet. The game is estimating.'}</div>
      <div class="row"><button id="timingStart" class="ghost">⏱ Start timing check</button><button id="timingReset" class="ghost">Reset timing</button></div>

function closeTuner() {
  TUNER.open = false; tunerEl.hidden = true;
  if (TUNER.resume && G.state === 'walking') startBacking();

}
document.getElementById('tunerBtn').onclick = () => TUNER.open ? closeTuner() : openTuner();

// Called from listen() instead of the game while the tuner is open.
function tunerListen(t, r) {
  if (r < gate) return;
  const f = detectPitch(mic.buf, ctx.sampleRate, 60, 1400); if (!f) return;
  const m = 69 + 12 * Math.log2(f / 440);
  TUNER.hist.push(m); if (TUNER.hist.length > 5) TUNER.hist.shift();
  const med = [...TUNER.hist].sort((a, b) => a - b)[Math.floor(TUNER.hist.length / 2)];
  TUNER.midi = Math.round(med); TUNER.cents = Math.round((med - TUNER.midi) * 100); TUNER.lastHeard = t;
}
function drawTuner() {
  if (!TUNER.open) return;
  const c = TUNER.c, W = 420, H = 230, cx = W / 2, cy = 200, R = 150;
  const t = performance.now() / 1000, live = TUNER.midi !== null && t - TUNER.lastHeard < 1.2;
  const cents = live ? TUNER.cents : 0, ok = live && Math.abs(cents) <= 5, near = live && Math.abs(cents) <= 15;
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#221a14';
  c.clearRect(0, 0, W, H);
  // the dial: green in the middle, amber, then red at the edges
  for (const [from, to, col] of [[-50, -15, '#D98B6A'], [-15, -5, '#E6C36A'], [-5, 5, '#7CC48E'], [5, 15, '#E6C36A'], [15, 50, '#D98B6A']]) {
    c.beginPath(); c.strokeStyle = col; c.lineWidth = 16; c.lineCap = 'butt';
    c.arc(cx, cy, R, Math.PI * 1.5 + from / 50 * .9, Math.PI * 1.5 + to / 50 * .9); c.stroke();
  }
  c.fillStyle = ink; c.font = '13px Georgia, serif'; c.textAlign = 'center';
  for (const v of [-50, -25, 0, 25, 50]) { const a = Math.PI * 1.5 + v / 50 * .9; c.fillText(v > 0 ? '+' + v : String(v), cx + Math.cos(a) * (R + 22), cy + Math.sin(a) * (R + 22) + 4); }
  // the needle, with a little wobble when nothing's heard
  const a = Math.PI * 1.5 + (live ? cents / 50 * .9 : Math.sin(t * 1.5) * .05);
  c.strokeStyle = live ? (ok ? '#2F6B3F' : near ? '#8A6A12' : '#8C2E22') : 'rgba(128,110,90,.5)'; c.lineWidth = 4; c.lineCap = 'round';
  c.lineWidth = 6; c.beginPath(); c.moveTo(cx + Math.cos(a) * (R - 52), cy + Math.sin(a) * (R - 52)); c.lineTo(cx + Math.cos(a) * (R + 10), cy + Math.sin(a) * (R + 10)); c.stroke();
  c.fillStyle = c.strokeStyle; c.beginPath(); c.arc(cx + Math.cos(a) * (R - 52), cy + Math.sin(a) * (R - 52), 6, 0, 7); c.fill();
  // the note, and how far off
  c.font = '600 46px Georgia, serif'; c.fillStyle = ink;
  c.fillText(live ? NAMES[pc(TUNER.midi)] : '–', cx, cy - 40);
  c.font = '17px Georgia, serif';
  c.fillText(!live ? 'pluck a string' : ok ? '✨ in tune! ✨' : cents < 0 ? `${-cents} cents flat: tighten` : `${cents} cents sharp: loosen`, cx, cy - 8);
  // which string you're nearest
  let best = null;
  if (live) for (const s of STRINGS) if (!best || Math.abs(TUNER.midi + cents / 100 - s[0]) < Math.abs(TUNER.midi + cents / 100 - best[0])) best = s;
  const ms = document.getElementById('micStatus');
  if (ms) {
    const tr = mic && mic.stream.getAudioTracks()[0], db = mic && mic.lastR > 0 ? Math.round(20 * Math.log10(mic.lastR)) : null;
    ms.textContent = !mic ? 'No microphone open.' : `${mic.label || 'microphone'} · ${tr ? tr.readyState + (tr.muted ? ' (muted by your system)' : '') : 'no input'} · level ${db === null ? 'silent' : db + ' dB'} · audio ${ctx ? ctx.state + ' at ' + ctx.sampleRate + ' Hz' : 'off'}`;
  }
  const tc = document.getElementById('timingCheck');
  if (tc && (TIMECHK.active || TIMECHK.msg)) tc.textContent = TIMECHK.active ? `⏱ Play one note on each click… (${TIMECHK.offsets.length} of 8 heard)` : TIMECHK.msg;
  const cc = document.getElementById('chuckCheck');
  if (cc) {
    const h = LAST_HIT, fresh = h && performance.now() / 1000 - h.at < 6;
    cc.innerHTML = CHUCK_CAL.active ? `✋ Chuck ${CHUCK_CAL.samples.length + 1} of 3…`
      : !fresh ? (CHUCK_PROFILE ? 'Listening for your chuck (it knows yours now).' : 'Waiting for a chuck…')
      : h.ok ? `✅ Chuck! <span class="muted">(died away to ${Math.round(h.tail * 100)}%, pitch in ${Math.round(h.pitched * 100)}%, low ${Math.round(h.lo * 100)}% · high ${Math.round(h.hi * 100)}%)</span>`
      : `❌ Not a chuck: it ${h.why}. <span class="muted">(died away to ${Math.round(h.tail * 100)}%, pitch in ${Math.round(h.pitched * 100)}%, low ${Math.round(h.lo * 100)}% · high ${Math.round(h.hi * 100)}%, loudness ${h.peak.toFixed(1)})</span>`;
  }
  tunerEl.querySelectorAll('.strings span').forEach(sp => sp.classList.toggle('on', !!best && +sp.dataset.m === best[0] && Math.abs(TUNER.midi - best[0]) <= 2));
  requestAnimationFrame(drawTuner);
}

/* ---------- Timing check: play along to 8 clicks; measure how late your notes are recognised ---------- */
const TIMECHK = { active: false, clicks: [], offsets: [], used: new Set(), tracker: null, prevRs: 0, endAt: 0, msg: '' };
function startTimingCheck() {
  if (!ctx || !mic) { TIMECHK.msg = 'The microphone needs to be on first.'; return; }
  const beat = 60 / 90, t0 = ctx.currentTime + 1.2;
  TIMECHK.clicks = []; TIMECHK.offsets = []; TIMECHK.used = new Set(); TIMECHK.tracker = new NoteTracker();
  for (let i = 0; i < 8; i++) {
    const at = t0 + i * beat, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = i % 4 ? 1000 : 1500; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.35, at + .002); g.gain.exponentialRampToValueAtTime(.001, at + .06);
    o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + .08); TIMECHK.clicks.push(at);
  }
  TIMECHK.endAt = t0 + 8 * beat + .9; TIMECHK.active = true; TIMECHK.msg = '';
}
function timingListen(t, r, rs) {
  const C = TIMECHK; if (!C.active) return;
  if (rs > gate * 2 && rs > C.prevRs * 1.5) C.tracker.markAttack(t); C.prevRs = rs;   // a fresh pick lets the same note count again
  const f = r < gate ? null : detectPitch(mic.buf, ctx.sampleRate, 75, 1400);
  const note = C.tracker.update(f ? 69 + 12 * Math.log2(f / 440) : null, t);
  if (note) {
    const now = ctx.currentTime; let best = -1, d = 9;
    C.clicks.forEach((c, i) => { if (!C.used.has(i) && Math.abs(now - c) < d) { d = Math.abs(now - c); best = i; } });
    if (best >= 0 && now - C.clicks[best] > -.25 && now - C.clicks[best] < .8) { C.used.add(best); C.offsets.push(now - C.clicks[best]); }
  }
  if (ctx.currentTime > C.endAt) {
    C.active = false;
    if (C.offsets.length < 4) { C.msg = `Only caught ${C.offsets.length} of 8. Try again: one clear note on each click.`; return; }
    const s = C.offsets.slice().sort((a, b) => a - b), lag = Math.min(.8, Math.max(.02, s[s.length >> 1]));
    TIMING = { lag, at: Date.now() }; try { localStorage.setItem(TIMING_KEY, JSON.stringify(TIMING)); } catch {}
    C.msg = `Measured: the game hears you ${Math.round(lag * 1000)} ms after the beat. Rides now allow for it.`;
  }
}

async function fillMicList() {
  const sel = document.getElementById('micSelect'); if (!sel || !navigator.mediaDevices) return;
  const ins = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId !== 'default' && d.deviceId !== 'communications');
  const cur = mic && mic.deviceId;
  sel.innerHTML = ins.length ? ins.map((d, i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || 'Microphone ' + (i + 1))}${HEADSET_MIC.test(d.label) ? ' (headphones)' : ''}</option>`).join('') : '<option>No microphones found</option>';
}

/* =====================================================================
   13. THE FRETBOARD: notes you've been taught, and where they live
   After you solve someone's lick, they may teach you one of its notes on the neck.
   Races only ever ask for notes you know. Saved in the browser.
   ===================================================================== */
const KNOWN_KEY = 'fret-detective-known-notes';
const STRING_NAMES = { 1: 'high E', 2: 'B', 3: 'G', 4: 'D', 5: 'A', 6: 'low E' };
const ORDINAL = { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th', 5: '5th', 6: '6th' };
function loadKnown() { try { return JSON.parse(localStorage.getItem(KNOWN_KEY)) || []; } catch { return []; } }
const knows = midi => loadKnown().some(k => k.midi === midi);
function learnNote(lesson, from) {
  const known = loadKnown();
  if (!known.some(k => k.midi === lesson.midi)) known.push({ midi: lesson.midi, string: lesson.string, fret: lesson.fret, from });
  try { localStorage.setItem(KNOWN_KEY, JSON.stringify(known)); } catch {}
  renderNotebook();
}
const noteLabel = k => `${NAMES[pc(k.midi)]} · ${ORDINAL[k.string]} string, ${k.fret ? 'fret ' + k.fret : 'open'}`;

// A small neck diagram, drawn like tab: the thin high E on top, the thick low E at the bottom.
// marks: [{ string, fret, label, hl }]
function fretboardSVG(marks, frets = 5) {
  const W = 430, H = 150, x0 = 104, x1 = W - 14, y0 = 18, gap = 22;
  const fx = f => x0 + (f - .5) * (x1 - x0) / frets, sy = s => y0 + (s - 1) * gap;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Guitar neck diagram">`;
  svg += `<rect x="${x0}" y="${y0 - 8}" width="${x1 - x0}" height="${gap * 5 + 16}" rx="4" fill="#E9D7B4"/>`;
  for (const f of [3, 5]) if (f <= frets) svg += `<circle cx="${fx(f)}" cy="${y0 + gap * 2.5}" r="5" fill="#CDB68C"/>`;
  for (let f = 1; f <= frets; f++) svg += `<line x1="${x0 + f * (x1 - x0) / frets}" y1="${y0 - 8}" x2="${x0 + f * (x1 - x0) / frets}" y2="${y0 + gap * 5 + 8}" stroke="#A88A5C" stroke-width="2"/>`;
  svg += `<line x1="${x0}" y1="${y0 - 8}" x2="${x0}" y2="${y0 + gap * 5 + 8}" stroke="#3A2A1A" stroke-width="6"/>`;
  for (let s = 1; s <= 6; s++) {
    svg += `<line x1="${x0 - 28}" y1="${sy(s)}" x2="${x1}" y2="${sy(s)}" stroke="#6B5640" stroke-width="${.8 + s * .35}"/>`;
    svg += `<text x="6" y="${sy(s) + 4}" font-family="Georgia, serif" font-size="11" fill="#6B5640">${ORDINAL[s]} ${STRING_NAMES[s]}</text>`;
  }
  for (let f = 1; f <= frets; f++) svg += `<text x="${fx(f)}" y="${H - 4}" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8A7458">${f}</text>`;
  for (const m of marks) {
    const x = m.fret === 0 ? x0 - 17 : fx(m.fret), y = sy(m.string);
    svg += m.fret === 0
      ? `<circle cx="${x}" cy="${y}" r="9" fill="${m.hl ? '#FFF4D6' : '#F7EEDB'}" stroke="${m.hl ? '#B0702A' : '#6B5640'}" stroke-width="${m.hl ? 3 : 2}"/>`
      : `<circle cx="${x}" cy="${y}" r="10" fill="${m.hl ? '#B0702A' : '#6B5640'}"/>`;
    svg += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="${m.fret === 0 ? '#3A2A1A' : '#FFF'}">${m.label}</text>`;
  }
  return svg + '</svg>';
}

/* ---------- A lesson: they show you the note, play it, and listen for it ---------- */
const pendingLessons = e => (e.teaches || []).filter(l => !knows(l.midi));
function startNoteLesson(e) {
  G.lesson = { enc: e, l: pendingLessons(e)[0], at: performance.now() / 1000, done: false };
  if (!G.lesson.l) { G.state = 'solved'; render(); return; }
  G.state = 'teaching'; G.said = G.lesson.l.say; render();
  setTimeout(() => G.state === 'teaching' && pluck(G.lesson.l.midi, ctx.currentTime + .05, 1.6, .9, ctx.destination), 900);
}
function teachNote(note, t) {
  const L = G.lesson; if (!L || L.done) return;
  G.lesson.heard = note.name;
  if (Math.round(note.midi) !== L.l.midi) { render(); return; }
  L.done = true; chime(); learnNote(L.l, L.enc.npc.split(',')[0]); render();
  setTimeout(() => { if (G.state !== 'teaching') return; pendingLessons(L.enc).length ? startNoteLesson(L.enc) : (G.state = 'solved', render()); }, 1800);
}
// Haven't played it for a while? They play it again.
function lessonIdle(t) {
  if (G.state !== 'teaching' || !G.lesson || G.lesson.done) return;
  if (t - G.lesson.at > 8) { G.lesson.at = t; pluck(G.lesson.l.midi, ctx.currentTime + .05, 1.6, .9, ctx.destination); }
}

/* =====================================================================
   14. PRACTICE: replay any mini-game you've beaten, straight from the title screen
   Practice runs use the notes you've learned, keep your best results, and
   change nothing in the story. Any location that's a mini-game appears here.
   ===================================================================== */
const CLEARED_KEY = 'fret-detective-cleared';
const MINIGAME_TYPES = ['race'];
function loadCleared() { try { return JSON.parse(localStorage.getItem(CLEARED_KEY)) || {}; } catch { return {}; } }
function markCleared(id, run) {
  const all = loadCleared(), prev = all[id];
  const better = !prev || run.pct > prev.pct || (run.pct === prev.pct && run.secs < prev.secs);
  all[id] = better ? { ...run, times: (prev?.times || 0) + 1 } : { ...prev, times: (prev.times || 0) + 1 };
  try { localStorage.setItem(CLEARED_KEY, JSON.stringify(all)); } catch {}
  return better && !!prev;   // a new personal best (not counting the first time)
}
const minigames = () => Object.values(CONTENT.locations).filter(l => MINIGAME_TYPES.includes(l.type) || (l.type === 'runner' && l.journey));
function practiceHTML() {
  const done = loadCleared(), games = minigames();
  if (!games.length) return '';
  const rows = games.map(g => {
    const r = done[g.id];
    return r
      ? `<button class="ghost" data-practice="${g.id}" style="text-align:left">${g.map?.icon || '🎯'} <strong>${esc(g.name)}</strong> <span class="muted">· best: ${r.cleared} of ${r.total} jumps, ${Math.round(r.secs)}s</span></button>`
      : `<button class="ghost" disabled style="text-align:left;opacity:.55">🔒 ??? <span class="muted">· find it in the story</span></button>`;
  }).join('');
  const any = games.some(g => done[g.id]);
  return `<h3 style="margin:16px 0 6px;font-size:16px">Practice</h3>
    <p class="muted" style="margin:0 0 8px">${any ? 'Jump straight into any mini-game you’ve beaten.' : 'Beat a mini-game in the story and you can practise it here any time.'}</p>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">${rows}</div>`;
}

/* =====================================================================
   16. HEALTH: keep the microphone and audio alive, and show what the game hears
   - A little meter shows the mic level, and lights up when a note is heard.
   - If the mic stream ends, the game reconnects it (same mic). If it only goes
     silent, the game says so but never re-opens it (that loops while a mic warms up).
   - If the browser pauses the audio, the game wakes it.
   - If something goes wrong in a frame, the game keeps running and says so.
   ===================================================================== */
const HEALTH = { zeroFor: 0, lastCheck: 0, lastReconnect: -99, status: '', statusAt: -99, err: '', errAt: -99, lastT: 0 };

  // At most two tries on its own: a device that keeps dropping shouldn't be re-opened over and over.
  HEALTH.tries = (HEALTH.tries || 0) + 1;

    const tr = mic && mic.stream.getAudioTracks()[0];

  let peak = 0; for (let i = 0; i < mic.buf.length; i += 8) peak = Math.max(peak, Math.abs(mic.buf[i]));

  // (that restarts the switch and loops). Just say so if it lasts, and point to the fix.
  HEALTH.zeroFor = peak === 0 ? HEALTH.zeroFor + dt : 0;
  if (HEALTH.zeroFor > 4 && t - HEALTH.statusAt > 15) healthSay('🎙️ No sound is reaching the game from ' + (mic.label || 'the microphone') + '. Try another mic in 🎵 Tuner.');

    else {

    c2.fillStyle = 'rgba(240,223,184,.18)'; c2.fillRect(x + 28, y + 8, 120, 6);
    c2.fillStyle = heardNote ? '#FFD45A' : lv > .05 ? '#8FC48A' : 'rgba(240,223,184,.4)'; c2.fillRect(x + 28, y + 8, 120 * lv, 6); }

    if (flat) { c2.font = 'bold 13px "Courier New", monospace'; c2.fillStyle = '#535353'; c2.fillText(msg.replace(/^\S+\s/, '').toUpperCase(), VW - 28, 76); c2.restore(); c2.textAlign = 'left'; return; }

  say(HEALTH.status, HEALTH.statusAt, '#F0DFB8');

/* =====================================================================
   17. THE RUNNER: an endless blues run with a hellhound on your trail
   You run by yourself. Turtles come at the chord changes: play the asked-for chord tone as one
   reaches you to hop it. Only playing in key keeps the hellhound back. Each key is a ladder:
   home roots, every root, thirds, fifths, sevenths. Climb it all and the key changes.

const RUN = { phase: 'intro', x: 0, gap: 300, stage: 0, keyIdx: 0, cleared: 0, stageCleared: 0, gates: [],

const RUN_SPEED = 260, RUN_X = 330, RUN_GAP_MAX = 330;
const runKey = () => LOC.keys[RUN.keyIdx % LOC.keys.length];
const runStage = () => LOC.stages[RUN.stage];

function applyRunKey() {
  const k = runKey(); KEY = new Set(k.pcs); GROUND = k.ground; NAMES = k.flats ? FLAT_NAMES : SHARP_NAMES; BACKING_BPM = runBpm();
}
function beginRunner() {
  Object.assign(RUN, { phase: 'intro', x: 0, gap: 300, stage: 0, keyIdx: 0, cleared: 0, stageCleared: 0, gates: [], banner: '' });
  applyRunKey(); G.state = 'runner'; G.cam = 0; render();
}
function startRun() {
  Object.assign(RUN, { phase: 'countdown', goAt: performance.now() / 1000 + 3, x: 0, gap: RUN_GAP_MAX, stage: 0, keyIdx: 0, cleared: 0, stageCleared: 0, tried: 0,
    gates: [], firstBeat: null, lastKeyAt: -9, crashAt: -9, jumpAt: -9, lurchAt: -9, banner: '', recent: [] });
  stopBacking(); applyRunKey(); render();
}
function runSay(msg) { RUN.banner = msg; RUN.bannerAt = performance.now() / 1000; }

// Queue turtles for the next couple of bars, by this level's rule.
function runQueue(clk) {

}

function runnerNote(note, t) {

function runnerUpdate(dt, t) {

// A journey's end: you made it, on to the next place.
function runArrive() {

    const live = g.state === 'coming' && g.T + outLat() - ctx.currentTime <= runWin()[0];

  c2.font = '14px Georgia, serif'; c2.fillStyle = 'rgba(240,223,184,.8)'; c2.fillText(`Level ${RUN.stage + 1} of ${LOC.stages.length}: ${st.title}`, 30, 60);

/* ---------- The minimal look: flat grey on white, pixel sprites, one ground line ---------- */
// The pixel kit (INK, PAPER, PX, SPRITES, sprite) lives in engine/art/minimal.js, shared with the Blues Road.
// A boulder: a stepped, pixel-ish lump with the chord on it and the note to play above.
function boulder(x, t, g) {
  if (x < -120 || x > VW + 120) return;
  const base = GROUND_Y - 4;
  let dx = 0, alpha = 1, crack = false;
  if (g.state === 'crashed') { crack = true; alpha = Math.max(0, 1 - (t - g.at) * 1.2); }
  if (alpha <= 0) return;
  c2.save(); c2.globalAlpha = alpha;
