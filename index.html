  c2.fillStyle = INK; c2.beginPath(); steps.forEach(([sx, sy], i) => { const px = Math.round((x + sx) / PX) * PX, py = Math.round((base + sy) / PX) * PX; i ? c2.lineTo(px, py) : c2.moveTo(px, py); }); c2.closePath(); c2.fill();
  c2.fillStyle = '#7A7A7A'; c2.fillRect(Math.round((x - 26) / PX) * PX, base - 44, PX * 2, PX); c2.fillRect(Math.round((x + 14) / PX) * PX, base - 20, PX, PX);
  if (crack) { c2.strokeStyle = PAPER; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(x - 4, base - 58); c2.lineTo(x + 4, base - 34); c2.lineTo(x - 6, base - 18); c2.lineTo(x + 2, base); c2.stroke(); }
  c2.fillStyle = PAPER; c2.font = `bold ${g.name.length > 2 ? 18 : 22}px "Courier New", monospace`; c2.textAlign = 'center'; c2.fillText(g.name, x, base - 22);
  if (g.state === 'coming') {
    const live = g.T + outLat() - ctx.currentTime <= runWin()[0];
    c2.fillStyle = INK; c2.font = `bold ${live ? 26 : 20}px "Courier New", monospace`; c2.fillText(NAMES[g.target], x, base - 72);
    if (live) { c2.fillRect(x - 22, base - 66, 44, 3); }
  }
  c2.restore(); c2.textAlign = 'left';
}
function minimalWorld(t) {
  c2.fillStyle = PAPER; c2.fillRect(0, 0, VW, VH);
  // drifting clouds, the ground line, and pebbles on the ground
  for (let i = 0; i < 4; i++) { const cx = ((i * 310 - RUN.x * .12) % (VW + 200) + VW + 200) % (VW + 200) - 100; sprite(SPRITES.cloud, cx, 90 + (i % 3) * 46, '#D8D8D8', 3); }
  c2.fillStyle = INK; c2.fillRect(0, GROUND_Y - 4, VW, 2);
  for (let k = 0; k < 40; k++) { const px = ((k * 97 - RUN.x) % VW + VW) % VW; c2.fillRect(Math.round(px / 2) * 2, GROUND_Y + 6 + (k * 13) % 26, 2 + (k % 3) * 2, 2); }
}
function minimalFrame(dt, t) {
  if (LOC.journey) { journeyFrame(dt, t); return; }

  for (const g of RUN.gates) if (g.T !== undefined) boulder(RUN_X + GATE_LEAD + (g.T + outLat() - ctx.currentTime) * GATE_SPEED, t, g);
  const js = t - RUN.jumpAt, cs = t - RUN.crashAt, jy = js < .6 ? Math.sin(js / .6 * Math.PI) * 100 : 0;
  const frame = jy > 4 ? 2 : RUN.phase === 'running' ? Math.floor(RUN.x / 40) % 2 : 0;
  const stumble = cs < .4 ? Math.sin(cs * 50) * 4 : 0;
  sprite(SPRITES.jo[frame], RUN_X - 36 + stumble, GROUND_Y - 4 - 14 * 5 - jy, INK, 5);
  const hx = RUN_X - 110 - RUN.gap;
  if (hx > -100) sprite(SPRITES.hound[(RUN.phase === 'running' || RUN.phase === 'over') ? Math.floor(t * 8) % 2 : 0], hx, GROUND_Y - 4 - 10 * 5, INK, 5);
  // the score, plainly
  const best = runBest(), dist = String(Math.round(RUN.x / 100)).padStart(5, '0');
  c2.fillStyle = INK; c2.font = 'bold 20px "Courier New", monospace'; c2.textAlign = 'right';
  c2.fillText(`${best ? 'HI ' + String(best.dist).padStart(5, '0') + '  ' : ''}${dist}`, VW - 24, 40);
  c2.textAlign = 'left'; c2.font = 'bold 16px "Courier New", monospace';
  c2.fillText(`${runKey().name.toUpperCase()}  ·  ${runStage().title.toUpperCase()}`, 24, 40);
  const st = runStage(); for (let i = 0; i < st.jumps; i++) c2.fillRect(24 + i * 14, 52, 8, i < RUN.stageCleared ? 8 : 2);
  // your notes as you play them: in key dark, out of key faded and struck through, target hits boxed

function closeOverlays(except) {

{
  const tm = toggleMap, tn = toggleNotebook, ot = openTuner, ct = closeTuner;

/* =====================================================================
   19. AMBIENCE: the sounds of a place, and the world answering you.
   A place lists its sounds in its content file (ambience: [crickets, frogs, wind,
   train, crowd, fan, clock]); they play quietly under the band. This file also sets
   how the band sounds from where you stand (through walls, on a radio, in the room),
   makes the door sounds, and reacts to notes (a blue note gets a howl; playing well

  }

}

const SFX = () => CONTENT.game.sound_effects !== false;

function startAmbience(list) {

  stopAmbience(); AMB.key = key; AMB.list = list; AMB.next = {}; AMB.cheered = false;

  const bed = (filterType, freq, q, level, lfoRate, lfoDepth) => {
    const n = ambNoise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = filterType; f.frequency.value = freq; f.Q.value = q; g.gain.value = level;
    n.connect(f).connect(g).connect(AMB.bus); n.start(now, Math.random() * 2);
    const parts = [n];

  if (ambHas('crowd')) for (const [f, l, r] of [[380, .016, .31], [650, .014, .47], [1050, .009, .23]]) bed('bandpass', f, 1.1, l, r, l * .7);   // a room full of talk

// ---------- one-off sounds ----------
function ambTone(type, f0, f1, t, dur, level, dest, filter) {

  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + Math.min(.02, dur / 4)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

function cricket(t) {        // three or four quick chirps, high above the guitar

}

  f.type = 'bandpass'; f.frequency.value = arnd(180, 320); f.Q.value = 7;

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .32);

}
function trainHorn(t) {      // a long way off: two horn notes in the key, a rumble underneath

}
function clink(t) { const f = arnd(2600, 3400); ambTone('sine', f, f, t, .25, .018); if (Math.random() < .4) ambTone('sine', f * 1.07, f * 1.07, t + .09, .2, .012); }
function tick(t, tock) { ambBurst(t, .012, .05, 'bandpass', tock ? 1500 : 2100, 4); }
// Doors: a creaking screen door and the slap as it swings shut behind you.
function doorSound() {
  if (!ctx || !SFX()) return;
  const t = ctx.currentTime + .02;
  ambTone('sawtooth', 150, 96, t, .45, .03, ctx.destination, ['bandpass', 900, 3]);
  ambBurst(t + .5, .18, .35, 'lowpass', 190, .8, ctx.destination); ambBurst(t + .5, .05, .12, 'bandpass', 1200, 2, ctx.destination);
}
// The dog joins in when you bend into the blue note.
function howl() {

  const t = ctx.currentTime + .05;
  for (const [mul, lv] of [[1, .04], [1.5, .012]]) {
    const o = ctx.createOscillator(), g = ctx.createGain(), v = ctx.createOscillator(), vg = ctx.createGain();
    o.frequency.setValueAtTime(420 * mul, t); o.frequency.exponentialRampToValueAtTime(640 * mul, t + .5); o.frequency.setValueAtTime(640 * mul, t + 1.2); o.frequency.exponentialRampToValueAtTime(520 * mul, t + 1.9);

  ambTone('sine', 620, 980, t + .3, .5, .02); ambTone('sine', 700, 1050, t + 1.1, .45, .015);
}

// Called for every note you play while walking.
function worldNote(note, ok, t) {
  if (!LOC.comes_alive || !ctx) return;
  const blue = (LOC.key.root + 6) % 12;
  if (pc(note.midi) === blue && t - AMB.howlAt > 7 && (LOC.props || []).some(p => p.who === 'dog')) { AMB.howlAt = t; howl(); }
}

// Every frame while walking: the background sounds that come and go, and how the band sounds from here.
function ambienceTick(t) {
  if (!ctx) return;
  const now = ctx.currentTime, due = (k, a, b) => { if (AMB.next[k] === undefined) AMB.next[k] = now + arnd(a * .3, b * .5); if (now >= AMB.next[k]) { AMB.next[k] = now + arnd(a, b); return true; } return false; };

    if (ambHas('crickets') && due('cricket', .25, .8)) cricket(now + .02);
    if (ambHas('frogs') && due('frog', 1.8, 5.5)) frog(now + .02);
    if (ambHas('crowd') && due('clink', 1.8, 6)) clink(now + .02);
    if (ambHas('clock') && due('tick', 1, 1)) { AMB.tock = !AMB.tock; tick(now + .02, AMB.tock); }

    if (LOC.room === 'walls') { const near = Math.max(0, 1 - Math.abs(G.x - LOC.music_at) / 1700); f = 650 + 4200 * near * near; g = .5 + .42 * near; }
    else if (LOC.room === 'radio') { f = 2700; hp = 480; g = .62; }
    backing.room.frequency.setTargetAtTime(f, now, .2); backing.roomHp.frequency.setTargetAtTime(hp, now, .2); backing.roomGain.gain.setTargetAtTime(g, now, .2);
  }
}

/* =====================================================================
   20. PICKLEBALL: doubles to a band, scored like a real game (first to 11, win by 2).
   Your team hits on every chord change; the ball comes over with that chord written on it.
   When it's coming to you, the chord tone you play decides your shot:
     root  -> a normal volley
     3rd   -> a SPIKE: low and fast. They have to save it with the 3rd of their chord,
              and it reaches them early, so they play just BEFORE the change.
     (rewritten below: 3rd volleys; on a pop-up 5th spikes, 7th dinks, 9th dinks harder; the root saves their spikes)
   The other team does the same to you. A spike or a lob can win the point outright if
   they can't save it. You have to keep a line going between your hits: go quiet and
   your return has no weight, clips the net and drops back on your side.
   Nothing ends the game but the score.
   ===================================================================== */
const PB = { phase: 'intro', level: 0, shots: [], rally: 0, k: 0, us: 0, them: 0, firstBeat: null,
  lastKeyAt: -9, goAt: 0, endAt: 0, banner: '', bannerAt: -99, recent: [], pointAt: -99, pointUs: false, best: 0, newBest: false,
  returns: 0, gapPlay: 0, pending: null, overAt: null, won: false, winners: 0, press: 0, pressNeed: 3 };
const PB_BEST_KEY = 'fret-detective-pickle-best';
const pbLevel = () => PB.lesson ? PB.lesson.level : LOC.levels[PB.level];   // in a lesson, the lesson sets how many balls are yours
const pbWin = s => WINDOWS[s && s.kind === 'spike' ? LOC.shots.window : LOC.window];
const pbOff = kind => kind === 'spike' ? -LOC.shots.spike : kind === 'pop' ? LOC.shots.pop : 0;   // a spike lands a beat early; a pop-up floats down two beats late, mid-bar
const pbHigh = kind => ({ spike: .3, dink7: .45, dink9: .45, normal: .8, pop: 1.75, serve: 1.1 }[kind] ?? .8);   // read the ball by its height
function pbBests() { try { return JSON.parse(localStorage.getItem(PB_BEST_KEY)) || {}; } catch { return {}; } }
function pbSay(msg) { PB.banner = msg; PB.bannerAt = performance.now() / 1000; }
// How a chord is written on the ball: short, the way a jazz chart writes it.
function pbLabel(root, q) { return NAMES[pc(root)] + (CHORD_SUFFIX[q] ?? ''); }
// Which notes return a ball, and what shot each one makes.
// The chord's 7th and 9th: written into the chord if it has one, otherwise whichever fits the key.
function pbExt(s) {
  const tq = TRIAD[s.q], r = s.root, inKey = d => KEY.has((r + d) % 12);
  const seventh = (r + (tq[3] ?? (inKey(11) && !inKey(10) ? 11 : 10))) % 12, ninth = (r + (inKey(2) ? 2 : 1)) % 12;
  return { seventh, ninth };
}
function pbAccept(s) {
  if (s.target !== undefined) return { [s.target]: 'normal' };   // a lesson ball naming one note: that note returns it
  const tq = TRIAD[s.q], r = s.root, third = (r + tq[1]) % 12, fifth = (r + tq[2]) % 12, { seventh, ninth } = pbExt(s);
  if (s.kind === 'spike') return { [r]: 'normal' };                                                   // their spike: only the root saves it
  if (s.kind === 'pop') return { [third]: 'normal', [fifth]: 'spike', [seventh]: 'dink7', [ninth]: 'dink9' };   // they popped it up: your chance
  return { [third]: 'normal' };                                                                        // a normal ball: the 3rd volleys it
}
// Who on their side sends the ball that lands on our bar line `bar`.
const pbOpp = bar => PB.lesson && PB.lesson.def.coach ? 'oppNear' : Math.floor(bar / BPC()) % 2 ? 'oppFar' : 'oppNear';   // in a coach lesson, the coach hits every ball

// ---------- what the band plays: a backing track, in any key, at any tempo ----------
const PB_SEL_KEY = 'fret-detective-pickle-sel';
const PB_FLAT_MAJOR = new Set([5, 10, 3, 8, 1]), PB_FLAT_MINOR = new Set([2, 7, 0, 5, 10]);
function pbSel() {
  if (!PB.sel) { try { PB.sel = JSON.parse(localStorage.getItem(PB_SEL_KEY)); } catch {} }
  if (!PB.sel || !LOC.tracks[PB.sel.track]) { const tr = LOC.tracks[0]; PB.sel = { track: 0, root: tr.key.root, bpm: tr.bpm }; }
  return PB.sel;
}
const pbMinor = tr => /minor/.test(tr.key.name);
const pbKeyName = (tr, root) => ((pbMinor(tr) ? PB_FLAT_MINOR : PB_FLAT_MAJOR).has(root) ? FLAT_NAMES : SHARP_NAMES)[root] + (pbMinor(tr) ? 'm' : '');
// Put the chosen track, key and tempo into the band and the rules.
function pbApply() {
  const sel = pbSel(), tr = LOC.tracks[sel.track], sh = ((sel.root - tr.key.root) % 12 + 12) % 12, d = sh > 6 ? sh - 12 : sh;
  GROUND = tr.ground.map(([b, q]) => [b + d, q]);

  KEY = new Set(tr.key.pcs.map(p => (p + d + 12) % 12));

}

  const sel = pbSel(); sel[k] = +v;
  if (k === 'track') { const tr = LOC.tracks[sel.track]; sel.root = tr.key.root; sel.bpm = tr.bpm; }
  try { localStorage.setItem(PB_SEL_KEY, JSON.stringify(sel)); } catch {}

}
function pbSettings() {
  const sel = pbSel(), tr = LOC.tracks[sel.track];

  const keys = Array.from({ length: 12 }, (_, r) => `<option value="${r}" ${r === sel.root ? 'selected' : ''}>${pbKeyName(tr, r)}</option>`).join('');
  return `<div class="pick"><span>Backing</span><select data-pksel="track">${tracks}</select>
    <span>Key</span><select data-pksel="root">${keys}</select>
    <span>Tempo</span><div class="tempo"><input type="range" data-pksel="bpm" min="70" max="170" step="2" value="${sel.bpm}"><b id="pkbpm">${sel.bpm} bpm</b></div></div>`;

  if (f.putt) { const w = 1 - Math.pow(1 - u, 2); return { ...at(w, Math.pow(w, 1.3)), z: 0 }; }
  const carry = .8;   // in the air for most of it, then a little roll
  if (u < carry) { const w = u / carry; return { ...at(w * .92, .92 * Math.pow(w, 1.8)), z: f.hz * 4 * w * (1 - w) }; }
  const w = .92 + .08 * (1 - Math.pow(1 - (u - carry) / (1 - carry), 2)); return { ...at(w, w), z: 0 };
}

/* =====================================================================
   22. SCALE SURFING: a heat against a bot. Waves roll in one after another, each a musical
   situation (a chord, a progression, a key change). While one rolls in, the band is already
   playing it: play a scale that fits before it reaches you and you catch it. Then improvise
   freely: in-scale notes keep you balanced, outside notes are turbulence (recoverable), and
   going quiet slows you down. Where you are on the wave's face follows your pitch. The most
   total ride time in the heat wins.
   The whole heat is planned at the start as one long song, so the band never has to stop.
   ===================================================================== */
const SF = { phase: 'intro', level: 0, mins: 5, waves: [], t0: 0, tEnd: 0, notes: [], you: 0, bot: 0, stab: 1, h: .4, lastNoteAt: -9,
  msg: '', msgAt: -99, view: { mode: 'calm', at: 0 }, best: 0, longest: 0, caught: 0, skipped: 0, spray: [], goAt: 0, endAt: 0, cur: -1 };
const SF_BEST_KEY = 'fret-detective-surf-best';
const sfLevel = () => LOC.levels[SF.level];
const sfNow = () => performance.now() / 1000;
const sfSpb = () => 60 / BACKING_BPM;
function sfSay(m) { SF.msg = m; SF.msgAt = sfNow(); }
function sfBests() { try { return JSON.parse(localStorage.getItem(SF_BEST_KEY)) || {}; } catch { return {}; } }
const sfClock = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;
const sfTitle = n => n.replace(/\b\w/g, c => c.toUpperCase());
// What a wave shows on its sign, by level: a scale name, its chords, or nothing at all (listen).
function sfLabel(w) {
  const l = sfLevel().label;
  if (l === 'hidden') return '?';
  if (l === 'scale') return sfTitle(w.def.segments[0].scales[0].name);
  const names = w.def.segments.flatMap(s => s.chords.map(c => c.name));
  if (w.def.segments.length > 1) return w.def.segments.map(s => s.chords[0].name + '\u2026').join(' \u2192 ');
  if (names.length > 4) return [...new Set(names)].join(' ') + ` (${names.length} bars)`;
  return names.join(' ');
}

// ---------- planning the heat: waves back to back, as one song ----------
function sfPlan() {
  const lv = sfLevel(), A = LOC.approach_bars, bpc = 4, all = LOC.waves.filter(w => lv.tiers.includes(w.tier));
  const mine = SF.drillTypes ? LOC.waves.filter(w => SF.drillTypes.includes(coachScaleType(w.segments[0].scales[0].name))) : [], pool = mine.length ? mine : all;   // today's session: only the scales you struggle with
  const ground = [], waves = []; let bar = 0, last = null;
  const heatBars = SF.mins * 60 / (sfSpb() * bpc);
  while (bar < heatBars + 16) {
    let def; do def = pool[Math.floor(Math.random() * pool.length)]; while (pool.length > 1 && def === last); last = def;
    // the ride: each segment's chords in turn (one bar each), looped to fill the wave; the approach: its opening bars
    const flat = def.segments.flatMap((s, si) => s.chords.map(c => ({ ...c, seg: si })));
    const ride = Array.from({ length: def.bars }, (_, i) => flat[i % flat.length]);
    const appr = Array.from({ length: A }, (_, i) => ride[i % ride.length]);
    const bars = [...appr, ...ride];
    waves.push({ def, start: bar, arrive: bar + A, end: bar + A + def.bars, bars, status: 'coming', ride: 0, bot: null, set: null });
    for (const b of bars) for (let k = 0; k < bpc; k++) ground.push([b.bass, b.q]);
    bar += bars.length;
  }
  return { ground, waves };
}
const sfT = bar => SF.t0 + bar * 4 * sfSpb();   // when a bar starts (audio time)
function sfWaveAt(tv) { return SF.waves.findIndex(w => tv >= sfT(w.start) && tv < sfT(w.end)); }
function sfSeg(w, tv) { const b = Math.floor((tv - sfT(w.start)) / (4 * sfSpb())); return w.bars[Math.max(0, Math.min(w.bars.length - 1, b))]; }

// ---------- a heat ----------
function beginSurf() { Object.assign(SF, { phase: 'intro' }); G.state = 'surf'; G.cam = 0; render(); const cs = csTake('surf'); if (cs) csShowTip(cs); }   // (today's session may have brought us here)
function startSurf(mins = SF.mins) {
  stopBacking();
  Object.assign(SF, { phase: 'countdown', mins, goAt: sfNow() + 3, notes: [], you: 0, bot: 0, stab: 1, h: .4, longest: 0, caught: 0, skipped: 0, spray: [], cur: -1,
    view: { mode: 'calm', at: 0 }, best: sfBests()[SF.level + ':' + mins] || 0, newBest: false, msg: '' });
  render();
}
function sfGo() {
  const { ground, waves } = sfPlan();
  GROUND = ground; Object.assign(LOC.backing, { ground, style: LOC.style, bpm: LOC.backing.bpm, beats_per_chord: 4, start_bar: 0 }); BACKING_BPM = LOC.backing.bpm;
  startBacking(); SF.t0 = backing.next; SF.tEnd = SF.t0 + SF.mins * 60; SF.waves = waves;
  SF.phase = 'heat'; sfSay('Paddle out!'); render();
}
function sfOver() {
  if (SF.session) csStepDone();   // a step of today's session
  SF.phase = 'over'; SF.endAt = sfNow(); stopBacking();
  const key = SF.level + ':' + SF.mins, bests = sfBests();
  if (SF.you > (bests[key] || 0)) { SF.newBest = (bests[key] || 0) > 0; bests[key] = Math.round(SF.you * 10) / 10; try { localStorage.setItem(SF_BEST_KEY, JSON.stringify(bests)); } catch {} }
  render();
}
function surfNote(note, t) {
  if (SF.phase !== 'heat') return;
  const nt = ctx.currentTime - noteLag(), p = pc(note.midi);
  SF.notes.push({ t: nt, pc: p, midi: note.midi }); if (SF.notes.length > 80) SF.notes.shift();
  SF.lastNoteAt = nt; G.lastNote = t;
  const w = SF.waves[SF.cur];
  if (!w || w.status !== 'riding') return;
  // riding: which of the wave's scales are you in? the one your last few notes fit best
  const seg = w.def.segments[sfSeg(w, nt).seg], recent = SF.notes.slice(-6);
  w.set = seg.scales.reduce((a, s) => { const f = recent.filter(n => s.pcs.includes(n.pc)).length; return f > a.f ? { s, f } : a; }, { s: seg.scales[0], f: -1 }).s;
  if (w.set.pcs.includes(p)) SF.stab = Math.min(1, SF.stab + LOC.ride.gain);
  else {
    // a passing note outside the scale is tension; leaning on the same wrong note again and again means you're in the wrong water
    w.outs = w.outs || {}; w.outs[p] = (w.outs[p] || 0) + 1;
    SF.stab -= LOC.ride.outside * w.outs[p];
    if (SF.session && w.outs[p] === 2) sfSay(`${NAMES[p]} isn\u2019t in ${sfTitle(w.set.name)}`);   // (the coach, on a note you keep leaning on)
    for (let k = 0; k < 8; k++) SF.spray.push({ x: 0, y: 0, vx: (Math.random() - .3) * 160, vy: -80 - Math.random() * 120, at: sfNow() }); }

}
// Did you catch it? Enough notes as it came in, mostly in one of the scales that fit its opening.
function sfCatch(w) {

  if (!ns.length) return { ok: false, let: true };   // you didn't paddle for it: you let it go by
  if (ns.length < LOC.catch.notes || new Set(ns.map(n => n.pc)).size < 3) return { ok: false, why: 'Not enough paddling \u2014 play more as it comes in' };
  const seg = w.def.segments[0];
  const best = seg.scales.reduce((a, s) => { const f = ns.filter(n => s.pcs.includes(n.pc)).length / ns.length; return f > a.f ? { s, f } : a; }, { s: null, f: -1 });
  if (best.f < LOC.catch.fit) return { ok: false, why: 'Wrong water \u2014 that scale doesn\u2019t fit this wave' };
  return { ok: true, set: best.s };
}
function surfFrame(dt, t) {
  if (SF.phase === 'countdown' && t >= SF.goAt) sfGo();
  if (SF.phase === 'heat') {
    const tv = ctx.currentTime - outLat();
    if (tv >= SF.tEnd) { if (SF.waves[SF.cur]?.status === 'riding') sfEndRide(SF.waves[SF.cur], 'Time!'); sfOver(); }
    else {
      const i = sfWaveAt(tv), w = SF.waves[i];
      if (i !== SF.cur && SF.waves[SF.cur]?.status === 'riding') sfEndRide(SF.waves[SF.cur], 'Rode it all the way in!');
      SF.cur = i;
      if (w && w.status === 'coming' && tv >= sfT(w.arrive)) {
        const c = sfCatch(w), lv = sfLevel();
        coachSurfCatch(w, c.ok, !c.let);   // the Pro Coach's notebook (a wave you let go by isn't counted)
        if (c.ok) { w.status = 'riding'; w.set = c.set; w.rideAt = tv; w.outs = {}; SF.stab = 1; SF.caught++; SF.view = { mode: 'ride', at: t }; sfSay('Caught it!'); }

        else { w.status = 'missed'; const sc = w.def.segments[0].scales[0]; sfSay(SF.session ? `This wave wanted ${sfTitle(sc.name)}: ${sc.pcs.map(p => NAMES[p]).join(' ')}` : c.why); }

        if (Math.random() < lv.bot.catch) w.bot = { from: tv, until: Math.min(sfT(w.end), tv + (lv.bot.ride[0] + Math.random() * (lv.bot.ride[1] - lv.bot.ride[0])) * (sfT(w.end) - sfT(w.arrive))) };

        if (SF.stab <= 0) { sfEndRide(w, 'Wipeout!', true); }

}

function surfPanel() {
  if (CS && CS.tipFor === 'surf') return csTipCard();
  if (SF.phase === 'over' && SF.session) return csCard(`${SF.caught} waves caught, ${sfClock(SF.you)} riding.`);
  const bests = sfBests(), best = bests[SF.level + ':' + SF.mins];
  if (SF.phase === 'intro' || SF.phase === 'over') {
    const over = SF.phase === 'over', won = SF.you > SF.bot;
    return gsCard({ title: 'Surfing', tag: 'Read the wave. Play a scale that fits. Ride it.',
      result: over ? `${won ? 'You win the heat' : SF.you === SF.bot ? 'A tie' : 'The bot wins'} ${sfClock(SF.you)}\u2013${sfClock(SF.bot)}` : '',
      stats: over ? `${SF.caught} waves caught \u00b7 longest ride ${SF.longest.toFixed(1)}s${SF.newBest ? ' \u00b7 new best!' : ''}` : '',
      rules: [['\ud83c\udf0a', 'Play a scale that fits a wave as it rolls in.'],
              ['\ud83c\udfc4', 'Stay in the scale for balance. High notes carve up.'],
              ['\u23f8', 'Don\u2019t want one? Let it pass.'],
              ['\u23f1', 'Most ride time beats the bot.']],
      right: `<p class="lab">Level</p>${gsSeg('sflevel', LOC.levels.map(l => l.title.replace(/^\d+ \u00b7 /, '')), SF.level)}

        <div class="plays"><button class="play" id="b-sfplay">${over ? 'Paddle out again' : 'Paddle out'}${best ? `<small>best ${sfClock(best)}</small>` : ''}</button></div>` });
  }

}

}
// Surfing: a mini-heat of the scales you struggle with
function csSurf(step) { SF.level = 2; SF.drillTypes = step.types; SF.session = true; startSurf(1.5); }

// ---------- the cards ----------
function csList(current) {
  return `<ul>${CS.plan.map((p, i) => `<li><span class="ic">${CS.done[i] ? '\u2705' : i === current ? '\u25b6\ufe0f' : ['\ud83c\udfd3', '\u26f3', '\ud83c\udf0a'][i]}</span><span><b>${esc(p.title)}</b><br><span style="color:#5b5045;font-size:12px">${esc(p.why.join(' \u00b7 '))}</span></span></li>`).join('')}</ul>`;
}
// On the island: today's plan, and a button to start (or carry on).
function csMenuCard() {
  csEnsure(); const n = csNext(), done = csAllDone(), starter = CS.plan.some(p => p.starter);
  return `<div class="gs"><div><h2>${done ? 'Session done!' : 'Today\u2019s session'}</h2><p class="tag">${done ? 'All three done. Your streak\u2019s safe; see you tomorrow.' : 'About ten minutes, built from what you\u2019ve been missing.'}</p>
      ${starter ? '<p class="stats">Play a little more and the coach will tailor every step to you.</p>' : ''}${csList(-1)}</div>
    <div><div class="plays">${done ? '' : `<button class="play" id="b-csgo" data-cs="${n}">${CS.done.some(Boolean) ? 'Carry on' : 'Start'}<small>${esc(CS.plan[n].title)}</small></button>`}</div>
      <div class="foot"><span></span><button id="b-csclose">Close</button></div></div></div>`;
}
// After a step: how it went, and on to the next.
function csCard(result) {

  const take = csTakeaway();
  return `<div class="gs"><div><h2>${done ? 'Session done!' : 'Step done'}</h2><p class="tag">${esc(result || '')}</p>${take ? `<p class="task" style="margin:0 0 8px">${esc(take).replace(/\n/g, '<br>')}</p>` : ''}${csList(n)}</div>
    <div><div class="plays">${done ? '<button class="play" id="b-csmenu">Back to the island</button>' : `<button class="play" id="b-csgo" data-cs="${n}">Next<small>${esc(CS.plan[n].title)}</small></button>`}</div>
      <div class="foot"><span></span>${resortBack()}</div></div></div>`;
}

// ---------- the coach's tips: before each step, made from the weak spot itself ----------
// Famous tunes whose first two notes make each jump: the classic ear-training trick (titles only, the well-known ones).
const CS_TUNE = { 1: 'the Jaws theme', '-1': 'F\u00fcr Elise', 2: 'Happy Birthday (its 2nd and 3rd notes)', '-2': 'Mary Had a Little Lamb', 3: 'Greensleeves', '-3': 'Hey Jude',
  4: 'When the Saints Go Marching In', '-4': 'Swing Low, Sweet Chariot', 5: 'Here Comes the Bride', '-5': 'Eine kleine Nachtmusik', 6: 'The Simpsons theme',
  7: 'Twinkle Twinkle Little Star', '-7': 'The Flintstones theme', 9: 'My Bonnie Lies Over the Ocean', 10: 'the Star Trek theme', 12: 'Somewhere Over the Rainbow' };
const CS_SCALE = { major: 'the do-re-mi scale: bright and settled', minor: 'major\u2019s darker twin: its 3rd, 6th and 7th lowered a fret',
  dorian: 'a minor scale with a raised 6th: minor, but brighter and jazzier', mixolydian: 'a major scale with the 7th lowered a fret: bluesy, made for 7th chords',
  lydian: 'a major scale with a raised 4th: dreamy and floating', phrygian: 'a minor scale with a lowered 2nd: dark, Spanish-sounding',
  'minor pentatonic': 'just five notes: the rock and blues box', 'major pentatonic': 'just five notes: major without its 4th and 7th, sweet and open',
  blues: 'minor pentatonic plus one \u201cblue note\u201d, the flat 5th', 'harmonic minor': 'a minor scale with a raised 7th that pulls hard back home',
  'melodic minor': 'a minor scale with a raised 6th and 7th: smooth and jazzy' };
TR_ROLE.from = '#221a14'; TR_ROLE.to = '#E5483F'; TR_ROLE.scale = '#2E6FB5';
const CS_DEG = { root: 0, '3rd': 1, '5th': 2, '7th': 3 };
function csChordSpell(root, q) { return TRIAD[q].map(x => NAMES[(root + x) % 12]); }
// Make the tip for a step: lines of text, a fretboard picture, and something to hear.
function csTip(step) {
  if (step.sport === 'pickle') {
    const lines = [], seen = new Set(); let show = [], hear = [];
    for (const x of step.tones.slice(0, 2)) {
      const sp = csChordSpell(x.root, x.q), name = pbLabel(x.root, x.q), i = CS_DEG[x.deg] ?? 1, up = TRIAD[x.q][Math.min(i, TRIAD[x.q].length - 1)];
      if (seen.has(name + x.deg)) continue; seen.add(name + x.deg);
      const tgt = NAMES[(x.root + up) % 12];
      lines.push(x.deg === 'root' ? `**${name}** is ${sp.join(', ')}. Its **root** is its name: **${tgt}**, the note that saves a spike.`
        : `**${name}** is ${sp.join(', ')}. Its **${x.deg}** is **${tgt}**: ${up} frets above ${NAMES[x.root]}${x.deg === '3rd' ? (up === 3 ? ' (a minor 3rd, so the chord is minor)' : ' (a major 3rd, so the chord is major)') : ''}.`);
      if (!show.length) { show = TRIAD[x.q].map((v, k) => ({ pc: (x.root + v) % 12, name: NAMES[(x.root + v) % 12], role: ['root', '3rd', '5th', '7th'][k] })); hear = show.map(n => n.pc); }
    }
    return { title: 'Chord tones', lines, show, hear, frets: 4 };
  }
  if (step.sport === 'golf') {
    const lines = step.ints.slice(0, 3).map(d => { const t = CS_TUNE[d]; return `**${csIntName(d)}**: ${Math.abs(d)} fret${Math.abs(d) === 1 ? '' : 's'} ${d > 0 ? 'up' : 'down'} the same string.${t ? ` It\u2019s the opening jump of *${t}*.` : ''}`; });
    const d = step.ints[0], from = d > 0 ? 0 : 7, to = ((from + d) % 12 + 12) % 12;
    return { title: 'Hearing the jumps', lines, show: [{ pc: from, name: NAMES[from], role: 'from' }, { pc: to, name: NAMES[to], role: 'to' }], hear: [from, to], hearMidi: [48 + from, 48 + from + d], frets: 4 };
  }
  // surfing: what each weak scale is, its notes, and what it fits
  const lines = []; let show = [], hear = [];
  for (const t of step.types.slice(0, 2)) {
    const w = (LOC.waves || []).find(w => coachScaleType(w.segments[0].scales[0].name) === t), sc = w && w.segments[0].scales[0];
    if (!sc) { lines.push(`**${t}**: ${CS_SCALE[t] || ''}`); continue; }
    const root = sc.pcs[0], notes = sc.pcs.map(p => NAMES[p]).join(' '), chord = w.segments[0].chords.map(c => c.name).join(' ');
    lines.push(`**${sfTitle(sc.name)}** is ${CS_SCALE[t] || 'its own colour'}: ${notes}. Reach for it over ${esc(chord)}.`);
    if (!show.length) { show = sc.pcs.map(p => ({ pc: p, name: NAMES[p], role: p === root ? 'root' : 'scale' })); hear = sc.pcs.slice(); }
  }
  return { title: 'Reading the waves', lines, show, hear, frets: 4 };
}
function csTipCard() {
  const T = CS.tipData, text = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  return `<div class="gs"><div><p class="lab">Coach\u2019s tip \u00b7 step ${CS.step + 1} of 3</p><h2>${esc(T.title)}</h2>${T.lines.map(l => `<p class="tag" style="margin:4px 0 8px">${text(l)}</p>`).join('')}</div>
    <div><div class="fb">${trFretSvg(T.show, T.frets)}</div>
      <div class="plays" style="margin-top:8px">${T.hear.length ? '<button class="play" id="b-cshear" style="background:#221a14">\u25b6 Hear it</button>' : ''}<button class="play" id="b-csletsgo">Let\u2019s go</button></div>
      <div class="foot"><span></span>${resortBack()}</div></div></div>`;
}
// A step's sport has opened: show its tip first; "Let's go" starts the drill.
function csShowTip(step) { CS.tipFor = step.sport; CS.tipData = csTip(step); csSnap(step); render(); }
function csLetsGo() { const step = CS.plan[CS.step]; CS.tipFor = null; ({ pickle: csPickle, golf: csGolf, surf: csSurf })[step.sport](step); }
function csHear() {
  const T = CS.tipData; if (!T || !ctx) return; let t = ctx.currentTime + .05;
  if (T.hearMidi) { T.hearMidi.forEach((m, i) => pluck(m, t + i * .5, 1.2, .85, ctx.destination)); return; }
  let m = 47; const ms = T.hear.map(p => { m = m + 1 + ((p - (m + 1)) % 12 + 12) % 12; return m; });
  ms.forEach((x, i) => pluck(x, t + i * .3, .9, .8, ctx.destination));
  if (CS.plan[CS.step].sport === 'pickle') { const end = t + ms.length * .3 + .15; ms.forEach(x => pluck(x, end, 1.8, .6, ctx.destination)); }   // a chord: its notes, then together
}
// ---------- before and after: today's takeaway ----------
function csKeys(step) {
  if (step.sport === 'pickle') return step.tones.map(x => ['pickle', `${x.deg}|${x.q}|${NAMES[x.root]}`, `${x.deg === 'root' ? 'Root' : x.deg} of ${pbLabel(x.root, x.q)}`]);
  if (step.sport === 'golf') return step.ints.map(d => ['golf', d > 0 ? `+${d}` : String(d), csIntName(d)]);
  return step.types.map(t => ['surf', `catch|${t}`, `${t[0].toUpperCase() + t.slice(1)} waves caught`]);
}
function csSnap(step) { CS.before = csKeys(step).map(([sp, k]) => { const e = (COACH[sp] || {})[k] || { n: 0, ok: 0 }; return { n: e.n, ok: e.ok }; }); }
function csTakeaway() {
  const step = CS.plan[CS.step]; if (!step || !CS.before) return '';
  const out = csKeys(step).map(([sp, k, label], i) => { const e = (COACH[sp] || {})[k] || { n: 0, ok: 0 }, b = CS.before[i] || { n: 0, ok: 0 }, n = e.n - b.n, ok = e.ok - b.ok;
    return n > 0 ? `${label}: ${b.n ? `${b.ok} of ${b.n} before` : 'new'} \u2192 ${ok} of ${n} today` : null; }).filter(Boolean).slice(0, 3);
  return out.join('\n');
}

/* =====================================================================
   10. LOOP
   ===================================================================== */
let lastT = performance.now();

// The world behind and around the characters: backdrop, then the placed props, then any middle layer.
function drawWorld(cam, t) {
  const B = BACKDROPS[LOC.backdrop];
  if (LOC.look === 'minimal') { B.back(cam, t); for (const p of LOC.props) if (!p.front) (p.type === 'signpost' ? minSignpost : PROPS[p.type])(p.x - cam, t, p); if (B.mid) B.mid(cam, t); return; }
  if (LOC.look === 'ink') { B.back(cam, t); for (const p of LOC.props) if (p.type === 'signpost') inkSignpost(p.x - cam, p); return; }
  if (B.back) B.back(cam, t);
  for (const p of LOC.props) PROPS[p.type](p.x - cam, t, p);
  if (B.mid) B.mid(cam, t);
}
const zoneAt = x => { let z = 0; (LOC.zones || []).forEach((zn, i) => { if (x > zn.at) z = i; }); return z; };
function frameBody(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  listen(t);
  autoFinish(t);
  if (LOC.type === 'lesson') { prologueFrame(dt, t); return; }
  if (LOC.type === 'race') { raceFrame(dt, t); return; }
  if (LOC.type === 'runner') { runnerFrame(dt, t); return; }
  if (LOC.type === 'pickleball') { pickleFrame(dt, t); return; }
  if (LOC.type === 'golf') { golfFrame(dt, t); return; }
  if (LOC.type === 'surf') { surfFrame(dt, t); return; }
  if (LOC.type === 'resort') { resortFrame(dt, t); return; }
  if (G.state === 'walking') {
    G.noteTimes = G.noteTimes.filter(nt => t - nt < 2);
    const ringing = t - (G.sustainAt || -9) < .2;          // a held, bent or vibrato'd note keeps him strolling
    const hold = Math.min(1.6, Math.max(.9, 2 * 60 / BACKING_BPM));   // slow music, slower playing: keep strolling a little longer
    const active = (t - G.lastNote) < hold || ringing || G.holdWalk;
    const busy = G.holdWalk ? 4 : Math.max(Math.min(G.noteTimes.length, 8), ringing ? 2 : 0);
    G.boost = Math.max(0, G.boost - dt * .5); G.glow = Math.max(0, G.glow - dt * 1.6);
    if (t - G.lastNote > 3) G.life = Math.max(0, (G.life || 0) - dt * .03);   // quiet for a while: the place slowly settles
    const target = active ? (80 + busy * 16) * (1 + G.boost * .55) : 0;
    G.vx += (target - G.vx) * Math.min(1, dt * (target >= G.vx ? 4 : 2.5));   // speed up briskly, slow down gently
    G.x += G.vx * dt * G.facing; G.phase += G.vx * dt * .055;
    // Jumping and the terrace
    const prevY = G.y;
    if (G.airPush) G.x += Math.max(0, 120 - G.vx) * dt * G.facing;
    if (G.onPlat && PLAT && (G.x < PLAT.x0 || G.x > PLAT.x1)) { G.onPlat = false; G.vy = 0; }
    if (!G.onPlat && (G.y > 0 || G.vy > 0)) {
      G.vy -= 1600 * dt; G.y += G.vy * dt;
      if (PLAT && G.vy < 0 && prevY >= PLAT.h && G.y <= PLAT.h && G.x >= PLAT.x0 && G.x <= PLAT.x1) { G.y = PLAT.h; G.vy = 0; G.onPlat = true; G.airPush = 0; }
      if (G.y <= 0) { G.y = 0; G.vy = 0; G.airPush = 0; }
    }
    if (COIN && !COIN.got && Math.abs(G.x - COIN.x) < 55 && COIN.h >= G.y - 30 && COIN.h <= G.y + 60) {
      COIN.got = true; COIN.at = t; G.coins++; chime();
      const ce = document.getElementById('coins'); if (ce) ce.textContent = G.coins;
    }
    G.x = Math.max(120, G.x);
    nearCheck(dt);
    if (LOC.type !== 'case' && LOC.type !== 'stroll') { return; } // just stepped into another location
    G.x = Math.min(G.x, LOC.length);
    const z = zoneAt(G.x);
    if (z !== G.zone && LOC.zones[z]) { G.zone = z; toast(LOC.zones[z].name); discover(LOC.id, LOC.zones[z].name); }




    const lc = document.getElementById('lastchord'); if (lc && lastChord.name) lc.textContent = 'turned';
    const hEl = document.getElementById('heard'); if (hEl) hEl.textContent = heard || '–';
  } else {
    G.phase += dt * 6; G.vx *= .85;
    if (G.state === 'recording' && recTracker && !recTracker.notes.length) { const el = document.getElementById('live'); if (el) el.textContent = heard ? heard + '…' : 'Listening…'; }
  }
  const camTarget = Math.max(0, G.x - (G.facing > 0 ? 330 : 630));
  G.cam += (camTarget - G.cam) * Math.min(1, dt * 3);
  const cam = G.cam;
  drawWorld(cam, t);
  for (const bf of BELFRIES) for (const b of bf.bells) PROPS.bell(b.x - cam, t, b);
  const npcPlaying = G.state === 'npcPlaying' && t < G.npcUntil;
  ENCOUNTERS.forEach((e, i) => {
    if (!e.character) return; // locks have no body
    const mine = ACTIVE === i && G.state !== 'walking';
    person(CHAR(e.character), e.x - cam, GROUND_Y, { facing: -1, pose: e.pose === 'play' || mine ? 'play' : 'idle', phase: G.phase, playing: ACTIVE === i && npcPlaying, scale: e.scale });
  });
  const walking = G.state === 'walking' || G.state === 'title';
  const stride = walking ? (G.y > 0 && !G.onPlat ? .5 : Math.min(1, G.vx / 70)) : 0;
  if (LOC.look === 'minimal') minPerson(G.x - cam, GROUND_Y - G.y, { facing: G.state === 'walking' ? G.facing : 1, phase: G.phase, stride });
  else if (LOC.look === 'ink') inkPerson(G.x - cam, GROUND_Y - G.y, { facing: G.state === 'walking' ? G.facing : 1, phase: G.phase, stride });
  else person(CHAR(LOC.player), G.x - cam, GROUND_Y - G.y, { facing: G.state === 'walking' ? G.facing : 1, pose: walking ? 'walk' : 'play', phase: walking ? G.phase : G.phase, stride, playing: G.state === 'recording' });
  const B = BACKDROPS[LOC.backdrop];
  if (LOC.look === 'minimal') for (const p of LOC.props) if (p.front) PROPS[p.type](p.x - cam, t, p);
  if (B.front) B.front(cam, t);
  if (B.atmosphere) B.atmosphere(dt);
  if (G.state === 'solved') bubble(CASE.x - cam, 160, CASE.done);
  // "Stand still to talk" cue, and a ring that fills as you dwell
  if (G.state === 'walking') {
    const i = encounterAt(G.x), way = exitAt(G.x), bf = belfryAt(G.x);
    if (i >= 0 || way || bf) {
      const ex = (bf ? bf.x : way ? way.x : ENCOUNTERS[i].x) - cam, ey = bf ? 96 : 150;
      c2.save(); c2.textAlign = 'center';
      const flat = LOC.look === 'minimal' || LOC.look === 'ink', cue = LOC.look === 'minimal' ? INK : flat ? INKC : '#F0DFB8';
      if (G.dwell > .05) {
        const f = Math.min(1, G.dwell / DWELL);
        c2.strokeStyle = flat ? 'rgba(83,83,83,.2)' : 'rgba(240,223,184,.28)'; c2.lineWidth = 4;
        c2.beginPath(); c2.arc(ex, ey, 20, 0, 7); c2.stroke();
        c2.strokeStyle = cue; c2.lineWidth = 4; c2.lineCap = LOC.look === 'minimal' ? 'butt' : 'round';
        c2.beginPath(); c2.arc(ex, ey, 20, -Math.PI / 2, -Math.PI / 2 + f * 6.2832); c2.stroke();
      } else {
        c2.globalAlpha = .55 + Math.sin(t * 3) * .2;
        const say = bf ? 'stop playing to ring the bells' : way ? way.prompt : 'stop playing to talk';
        c2.font = LOC.look === 'minimal' ? `bold 15px ${MONO}` : flat ? 'italic 17px Georgia, serif' : '500 17px Georgia, serif'; c2.fillStyle = cue;
        c2.fillText(LOC.look === 'minimal' ? say.toUpperCase() : say, ex, ey + 6);
      }
      c2.restore(); c2.textAlign = 'left';
    }
  }
  const ta = performance.now() / 1000 - G.toastAt;
  if (G.toast && ta < 3.2) {
    c2.save(); c2.globalAlpha = Math.min(1, ta * 3) * Math.min(1, (3.2 - ta) * 1.6);
    c2.textAlign = 'center';
    if (LOC.look === 'minimal') { c2.font = `bold 22px ${MONO}`; c2.fillStyle = INK; c2.fillText(G.toast.toUpperCase(), VW / 2, 140); }
    else { c2.font = '600 26px Georgia, serif'; c2.fillStyle = 'rgba(14,12,20,.55)'; c2.fillText(G.toast, VW / 2 + 2, 92); c2.fillStyle = '#F0DFB8'; c2.fillText(G.toast, VW / 2, 90); }
    c2.restore(); c2.textAlign = 'left';
  }
  if (G.state === 'failed' && ENCOUNTERS[ACTIVE] && !CASE.lock) bubble(CASE.x - cam, 160, 'Not today…');
  const arr = t - PRO.arriveAt;
  if (arr < 10.5) {
    if (arr < 1.6) { c2.fillStyle = LOC.look === 'minimal' ? `rgba(247,247,247,${1 - arr / 1.6})` : LOC.look === 'ink' ? `rgba(243,238,228,${1 - arr / 1.6})` : `rgba(6,5,9,${1 - arr / 1.6})`; c2.fillRect(0, 0, VW, VH); }
    if (arr > 3.3) { c2.save(); c2.globalAlpha = Math.min(1, (10.5 - arr) * 1.5); if (LOC.arrival) caption([LOC.arrival], t, arr - 3.3, 96); c2.restore(); }
  }
  // through a door: a quick fade from paper
  const da = performance.now() / 1000 - (G.doorAt || -9);
  if (da < .7) { c2.fillStyle = `rgba(247,247,247,${1 - da / .7})`; c2.fillRect(0, 0, VW, VH); }
  if (typeof ambienceTick === 'function') ambienceTick(t);
  hud();
}
// The loop itself: whatever happens in a frame, listening and drawing carry on next frame.
function frame(now) {
  try { frameBody(now); } catch (e) { reportError(e); }
  try { micHealth(now / 1000); drawMicMeter(now / 1000); } catch (e) { reportError(e); }
  requestAnimationFrame(frame);
}

// The title screen shows where "Skip" would take you.
loadLocation(CONTENT.game.skip_to);
render();
renderNotebook();
